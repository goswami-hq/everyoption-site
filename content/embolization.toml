# The embolization explainer: one source for every embolization page (ai-hq job platform-condition-pages-0020; his words,
# HQ chat 2026-11-11 14:25 CT: "Across all the embo pages, we need to explain what embolization is simply and the types of
# things we use as embolic agents simply (what they're made of etc)"). Rendered by tools/embolization.py into the short
# guide's lead option (fold) and the in-depth page's embolization option (section); tools/pattern.py checks both.
# Evidence (every fact, its quote and how it was read; number-checked by a fresh agent 2026-11-11):
# ai-hq projects/platform/content/pages/sources/embolic-materials-evidence-2026-11-11.md. Wording choices that differ
# from his mockup are on his list: ai-hq projects/platform/content/page-reviews/2026-11-11-embolization-explainer/.
# Short guide: no brand names, no study details. In-depth: chemical names in brackets; product names only where a
# patient will hear them.

fold_heading = "What is embolization?"
opening = "Embolization means blocking blood flow on purpose, from inside a blood vessel. A doctor guides a thin tube to the small blood vessels that feed the problem area. Then the doctor releases a material that blocks them.[^emb-rinfo]"
gelatin = "If you avoid pork products or have had a reaction to gelatin, tell your doctor before the procedure.[^emb-embo]"

deep_heading = "What is used to block the blood flow?"
deep_opening = "Embolization means blocking blood flow on purpose, from inside a blood vessel. A doctor guides a thin tube to the spot and releases a material that blocks the small blood vessels feeding it. Doctors choose the material by the size of the vessels and how long the blockage should last.[^emb-rinfo]"
deep_gelatin = "Some beads contain gelatin from pigs. If you avoid pork products or have had a reaction to gelatin, tell your doctor. Types without gelatin are available.[^emb-embo][^emb-bb510k][^emb-ez510k14]"
other_heading = "Other materials doctors use"

[[material]]
id = "beads"
name = "Tiny beads"
term = "microspheres"
icon = "embo-beads"
made = "Round beads of plastic. One common type is an acrylic plastic with gelatin from pigs (Embosphere). Others are a water-holding plastic gel (Bead Block, made of polyvinyl alcohol) or a plastic gel with a thin coating (Embozene).[^emb-embo][^emb-bb510k][^emb-ez510k14]"
stays = "They do not dissolve. They stay in place for good. They contain no metal and do not stop you from having an MRI.[^emb-embo][^emb-bb510k][^emb-ezgudid]"

[[material]]
id = "particles"
name = "Small particles"
term = "polyvinyl alcohol"
icon = "embo-particles"
made = "Rough, uneven flakes of a plastic.[^emb-contour]"
stays = "They stay in place for good.[^emb-contour]"

[[material]]
id = "coils"
name = "Tiny metal coils"
icon = "embo-coil"
made = "Small springs of platinum or another metal, often with soft fibers that help a clot form. During prostate embolization, doctors sometimes place one to protect a nearby artery.[^emb-nester][^emb-rinfo][^emb-maclean23][^emb-richardson25]"
stays = "They stay in place for good. They are safe in an MRI scanner under set conditions; tell the scanner staff you have them.[^emb-nester]"

[[material]]
id = "plugs"
name = "Plugs"
icon = "embo-plug"
made = "A small, self-opening plug of fine wire mesh, made of nitinol (a nickel and titanium metal).[^emb-avp]"
stays = "It stays in place for good. It is safe in an MRI scanner under set conditions; tell the scanner staff you have it.[^emb-avp]"

[[material]]
id = "glue"
name = "Medical glue"
term = "n-butyl cyanoacrylate"
made = "A liquid glue that the doctor injects into the vein. It hardens quickly and blocks the vein.[^emb-rinfo][^emb-strobl26]"
stays = "It is not made to dissolve.[^emb-rinfo]"

[[material]]
id = "foam"
name = "Vein-closing medicine"
term = "sclerosant"
icon = "embo-foam"
made = "A medicine that works like a mild detergent, often mixed into a foam (sodium tetradecyl sulfate or polidocanol). It irritates the inside lining of the vein.[^emb-sts][^emb-pol]"
stays = "The vein scars shut. This is not always permanent.[^emb-sts]"

[[material]]
id = "dissolve"
name = "Materials that dissolve"
icon = "embo-dissolve"
made = "Materials made to break down within hours to days, so blood flow can come back. One is an antibiotic powder (imipenem and cilastatin) that forms very fine particles. In some countries, doctors also use dissolving beads made of gelatin or a seaweed-based gel (alginate).[^emb-sirgae][^emb-gaucho][^emb-amin26][^emb-little25]"
stays = "They break down. Early studies suggest knee pain improves about the same with these as with beads that stay.[^emb-gaucho][^emb-lanza26]"

[[condition]]
slug = "fibroids"
label = "fibroids"
page = "/fibroids/every-option/"
materials = ["beads", "particles"]
line = "For fibroids, the material is tiny beads or small particles. They are made of plastic, and some types also contain gelatin from pigs. They stay in place for good.[^emb-embo][^emb-bb510k][^emb-contour]"
gelatin = true

[[condition]]
slug = "enlarged-prostate"
label = "enlarged prostate"
page = "/enlarged-prostate/every-option/"
materials = ["beads", "particles"]
line = "For the prostate, the material is tiny beads or small particles made of plastic. Some types also contain gelatin from pigs. They stay in place for good.[^emb-embo][^emb-bb510k][^emb-contour]"
gelatin = true

[[condition]]
slug = "knee-arthritis"
label = "knee arthritis"
page = "/knee-arthritis/every-option/"
materials = ["beads", "dissolve"]
line = "For the knee, doctors use either tiny plastic beads that stay in place for good, or a material made to break down within hours to days.[^emb-sirgae][^emb-gaucho]"
gelatin = true
deep_note = "In the United States, no material has a formal approval for knee pain, so every material used for GAE is used off-label (outside what its label lists).[^emb-sirgae]"

[[condition]]
slug = "hemorrhoids"
label = "hemorrhoids"
page = "/hemorrhoids/every-option/"
materials = ["coils", "beads"]
line = "For hemorrhoids, the material is tiny metal coils, tiny plastic beads, or both. Both stay in place for good.[^emb-kucukay21][^emb-moussa20][^emb-nester][^emb-embo]"
gelatin = true

[[condition]]
slug = "chronic-pelvic-pain"
label = "chronic pelvic pain"
page = "/chronic-pelvic-pain/"
materials = ["coils", "plugs", "glue", "foam"]
line = "For pelvic veins, the doctor uses tiny metal coils, small wire-mesh plugs, a medical glue, or a medicine that makes the vein scar shut. The coils and plugs stay in place for good.[^emb-strobl26][^emb-nester][^emb-avp]"
gelatin = false

