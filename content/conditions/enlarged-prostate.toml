[[sections]]
id = "what"
place = "after"
heading = "What is an enlarged prostate?"
text = [
  "The prostate is a small gland that wraps around the urethra, the tube that carries urine out of the body. In almost all men, it grows with age.[^mpbph] It can squeeze the urethra and make it hard to empty the bladder.[^niddk] As men get older, this gets more common, with more than 9 out of 10 men having it in their 80s.[^mpbph]",
  "Symptoms can include frequent peeing, a strong and sudden urge to go, getting up at night to pee, a weak or slow stream, straining, and dribbling at the end.[^mpbph][^niddk] See a doctor if your bladder does not feel empty after you pee, or if self-care has not helped after 2 months.[^mpbph] A doctor also checks for other causes, such as infection or cancer.[^mpbph][^niddk]",
]

[[sections]]
id = "ask"
place = "after"
heading = "What should I ask my doctor?"
list = [
  "Which options could work for me, and which could not?",
  "How would each option affect my erections and ejaculation?",
  "How long would I need to recover, and will I need a urine tube?",
  "Do you offer prostate artery embolization, or can you refer me to someone who does?",
]

[[faq]]
q = "Do I need treatment?"
a = "Not always. If your symptoms are mild and do not bother you, your doctor may watch them with yearly checkups. Drinking less before bed and cutting back on alcohol and caffeine can help.[^niddk]"

[[faq]]
q = "Is an enlarged prostate cancer?"
a = "No. It is not cancer, and it does not raise your risk of prostate cancer.[^mpbph] Some symptoms can look alike, so your doctor may check your PSA, a blood test, to screen you for prostate cancer.[^mpbph][^niddk]"

[[faq]]
q = "Will treatment affect my sex life?"
a = "It depends on the treatment. Many surgeries cause dry orgasms, where semen goes into the bladder.[^calik] Some pills can lower your sex drive or cause erection problems.[^proscar] Ask your doctor how each option fits your goals before you choose."

[[faq]]
q = "Do I need surgery for an enlarged prostate?"
a = "Not always. Medicines and less invasive treatments, such as PAE (prostate artery embolization), are also options. Surgery is often used when other treatments have not helped or problems develop.[^niddk]"

[[options]]
id = "alpha-blockers"
name = "Alpha blockers"
what = "These include pills (such as tamsulosin). They relax the muscles around the prostate and bladder so urine flows more easily.[^mpbph][^niddk]"
invasive = "These are pills. No procedure is needed."
works = "Good evidence suggests these pills ease symptoms for many men.[^niddk] Most men notice a change within 3 to 7 days.[^mpbph]"
side = "You may feel dizzy, mostly when you stand up. Ejaculation may change. If you plan eye surgery for cataracts, tell your eye doctor if you take one or have taken one.[^flomax]"

[[options]]
id = "shrinking-pills"
name = "Prostate-shrinking pills"
what = "These are pills (such as finasteride or dutasteride). They lower a hormone that makes the prostate grow, so it slowly shrinks.[^mpbph][^niddk][^proscar]"
invasive = "These are pills. No procedure is needed."
works = "It can take 3 to 6 months to feel better.[^mpbph] Strong evidence shows they lower the chance of needing surgery.[^proscar][^avodart] Finasteride cut that chance about in half over 4 years.[^pless][^proscar] Taking one with an alpha blocker may work better than either alone.[^niddk]"
side = "You may have a lower sex drive or erection problems. They cut your PSA level about in half, so tell your doctor before a PSA test. They may raise the chance of a more serious prostate cancer.[^mpbph][^proscar][^avodart]"

[[options]]
id = "tadalafil"
name = "Tadalafil"
what = "This is a pill. It relaxes muscles around the bladder and prostate. It is also used for erection problems.[^niddk][^cialis]"
invasive = "This is a pill. No procedure is needed."
works = "Good evidence suggests it eases symptoms a little.[^niddk][^cialis]"
side = "You may have a headache, upset stomach, or back pain. Do not take it with nitrate heart medicines. It is not recommended with alpha blockers for this use.[^cialis]"

[[options]]
id = "embolization"
name = "Prostate artery embolization (PAE)"
what = "Tiny beads slow blood flow to the prostate so it shrinks. Urine can then flow more easily.[^sirpt][^ucla]"
invasive = "You only need a tiny skin nick in the wrist or groin. You stay awake, with medicine to help you relax. Nothing is cut out. Most men do not need a urine tube through the penis.[^sirpt][^ucla] Most men go home the same day.[^ucla][^ukrope] Most men are back to normal activities within a few days. Avoid heavy activity for about a week.[^bsir][^penn] After TURP surgery, recovery takes 3 to 6 weeks.[^mpturpdc]"
works = "Early results are encouraging. Most men feel much better, and for many the relief lasts at least three years.[^sham][^pisco] The American Urological Association's 2026 guideline lists PAE as an option for men with larger prostates. It says PAE improved symptoms about as much as TURP surgery, for up to 2 years.[^aua][^cochrane] It is also an option for men who take blood thinners or have a high risk of bleeding.[^aua]\nSome men need another treatment later, such as a second embolization or surgery: about 1 out of 5 within five years.[^bilhim] Early studies suggest this is more likely than after surgery.[^cochrane][^abt5] If PAE works for you, it may help you avoid or put off surgery, but we don't know that yet. If it does not, surgery is still an option.[^bilhim]"
side = "You may have a burning feeling in your lower belly, need to pee often, and some pelvic pain for a few days. A little blood in your urine or stool can happen.[^sirpt][^gstt] Erections usually stay the same.[^cochrane] Some men may have less semen afterward, but it is much less common than after TURP surgery.[^ejac][^cochrane] Serious problems are uncommon.[^pisco][^cochrane]"

[[options]]
id = "urethral-lift"
name = "Urethral lift"
what = "Small implants lift and hold the prostate away from the urethra, like tiebacks on a curtain.[^niddk][^mpmin]"
invasive = "It is done through the penis, with no cuts in the skin.[^mpmin] Most men need little or no urine tube time and return to normal activity in about 1 week.[^lift5]"
works = "Early studies suggest it eases symptoms, often within 2 weeks. It works only for some prostate sizes, so ask if yours fits. About 1 out of 7 men need another procedure within 5 years.[^lift5]"
side = "Side effects are mostly mild and short-lived. Erections and ejaculation usually stay the same.[^lift5]"

[[options]]
id = "water-vapor"
name = "Water vapor (steam) therapy"
what = "Steam is released into the prostate to burn the inside of the prostate. This removes some of the extra tissue and makes the path for urine larger.[^niddk][^mpmin]"
invasive = "It is done through the penis, with no cuts in the skin. It can be done in the doctor's office.[^mpmin]"
works = "Early studies suggest it eases symptoms, often within 3 months. It works only for some prostate sizes, so ask if yours fits. Fewer than 1 out of 20 men need surgery within 5 years.[^rezum5]"
side = "Side effects are mostly mild and go away quickly. Lasting erection problems are rare.[^rezum2][^rezum5]"

[[options]]
id = "temporary-implant"
name = "Temporary implant"
what = "A small folded device is placed in the prostate for about a week. As it opens, it makes small cuts that widen the passage. Then it is removed.[^mpmin][^itind]"
invasive = "It is placed and later removed through the penis, with no cuts in the skin.[^mpmin][^itind]"
works = "Early studies suggest it helps some men. Many men also felt better after a fake procedure, so doctors are still learning how much of the relief comes from the implant.[^itind] We do not yet know how long it lasts.[^itind4]"
side = "Side effects are mostly mild and short-lived. New erection or ejaculation problems seem uncommon.[^itind]"

[[options]]
id = "balloon"
name = "Medicine-coated balloon"
what = "A balloon passed through the penis widens the space where the prostate squeezes the urethra. The balloon is coated with a medicine that helps keep it from closing again.[^fdaopt]"
invasive = "It is done through the penis, with no cuts in the skin. It can be done in the office.[^pinnacle]"
works = "Early studies suggest it eases symptoms for at least 2 years.[^pinnacle][^pinnacle2] It works only for some prostate sizes, so ask if yours fits.[^pinnacle]"
side = "You may have blood in your urine or a bladder infection. Sex life usually stays the same.[^pinnacle2]"

[[options]]
id = "turp"
name = "Transurethral resection (TURP)"
what = "Surgery removes the inside of the prostate with a small tool passed through the penis.[^mpturp]"
invasive = "There are no cuts in the skin. You are asleep or numb from the waist down. Most men stay in the hospital for 1 to 3 days and have a urine tube for 1 to 3 days.[^mpturp] Recovery takes about 3 to 6 weeks.[^mpturpdc]"
works = "Strong evidence shows it relieves symptoms most of the time.[^mpturp] About 1 out of 10 men need more surgery within 20 years.[^niddk]"
side = "Many men have dry orgasms afterward, where semen goes into the bladder. This can be permanent.[^mpturpdc][^calik] Bleeding, infection, erection problems, and leaking urine can happen. Scar tissue can narrow the urethra.[^mpturp][^niddk][^nhsturp]"

[[options]]
id = "laser"
name = "Laser surgery"
what = "A laser passed through the penis removes or vaporizes the blocking tissue. One type is called HoLEP.[^mpmin]"
invasive = "There are no cuts in the skin. Most men go home the same day or the next day, with a urine tube for a few days.[^mpmin] There is less bleeding and a shorter hospital stay than with TURP.[^holep]"
works = "Good evidence suggests HoLEP works at least as well as TURP.[^holep] It improves the flow of urine.[^mpmin]"
side = "Many men have dry orgasms afterward.[^calik][^mpmin] Erection problems and leaking urine can happen.[^mpmin]"

[[options]]
id = "waterjet"
name = "Waterjet surgery"
what = "High-pressure jets of water, passed through the penis, remove the blocking tissue.[^mpmin]"
invasive = "There are no cuts in the skin. You have a urine tube for a few days.[^mpmin]"
works = "Early studies suggest it works about as well as TURP for at least 5 years, in small to medium prostates.[^water5]"
side = "Ejaculation problems are less common than after TURP, but about 1 out of 14 men still have them.[^water5] Erection problems and leaking urine can happen.[^mpmin]"

[[options]]
id = "open-prostatectomy"
name = "Open or robotic prostate removal"
what = "Surgery through the belly removes the inside of a very large prostate.[^mpsimple]"
invasive = "It takes a cut in the lower belly, or small cuts with a robot.[^mpsimple][^niddk] After open surgery, most men stay in the hospital for 2 to 4 days with a urine tube. Recovery takes about 6 weeks.[^mpsimple]"
works = "It is often used when the prostate is too large for other surgery. Most men can pee as usual afterward.[^mpsimple]"
side = "Dry orgasms, leaking urine, bleeding, and infection can happen.[^mpsimple] After open surgery, up to 1 out of 5 people get a hernia at the scar.[^cchernia]"

