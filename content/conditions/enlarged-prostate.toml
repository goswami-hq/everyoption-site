answer = "An enlarged prostate is common as men age. This is not cancer and does not raise your risk of prostate cancer. Many men have no symptoms.[^mpbph] If you have trouble peeing, embolization is one of many options. You can also consider medicines, other less invasive treatments, or surgery.[^niddk] The right choice depends on your symptoms and goals."
urgent = "If you cannot pee at all, have a fever with chills, see a lot of blood or clots in your urine, have severe pain, or feel very sick or faint, call 911."
