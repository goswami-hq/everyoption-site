title = "Arthritis Embolization (GAE): Every Treatment Option | Every Option"
description = "Knee arthritis is common and can be painful. Learn about knee artery embolization (GAE), embolization for other joints, and every other option: how invasive each is, how well it works, and its side effects."
h1 = "A newer option for knee arthritis pain, without surgery"
answer = "Osteoarthritis is the most common joint problem. It happens when the cushion in a joint wears down over time.[^mpoa] It cannot be cured, but the pain can often be eased.[^mpoa] If knee pain limits your life, embolization is not your only option. You can also consider exercise, medicines, injections, or surgery.[^mpoa] The right choice depends on your symptoms and goals."
urgent = "If a joint suddenly turns hot, red, and swollen, you cannot put weight on it, you have a fever, or you feel very sick or faint, call 911."
finder_button = "Find a doctor for knee embolization (GAE)"
finder_heading = "A newer option for knee arthritis pain, without surgery"
finder_intro = "Knee artery embolization works through a tiny skin nick. Nothing in the knee is cut or replaced. Most people go home the same day.\nThe finder lists doctors who perform **knee** embolization."
finder_how = "#embolization"
options_heading = "Your other options for knee arthritis"
faq_heading = "Common questions"
learn_heading = "Learn more"
not_advice = "Education, not medical advice. Talk to your doctor about your own care."
find_heading = "Find a doctor"
find_text = ["Our free finder lists doctors near you who perform knee embolization (genicular artery embolization). It is not a ranking. It does not show who treats other joints."]
