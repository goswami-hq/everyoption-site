# Other joints: shown open right after the knee section (place = "lead"), each joint with its own evidence and no knee
# number. Every study here is small and none compared embolization with a fake procedure (evidence.md section 3).
[[sections]]
id = "other-joints"
place = "lead"
heading = "Embolization for other joints"
text = [
  "Doctors are also trying embolization for arthritis in other joints. These studies are small, and none had a fake-procedure group. So for these joints, the results are early.[^hipe][^feier][^lee24]",
  "**Hip.** A few small studies report less hip pain for up to a year.[^hipe][^feier]",
  "**Hand and fingers.** One small study of 9 people reported less hand pain.[^lee24]",
  "**Shoulder.** There are no studies yet of embolization for shoulder arthritis.[^aihta]",
  "**Frozen shoulder** is not arthritis. It is a stiff, painful shoulder from a swollen, scarred joint lining. It often gets better on its own, but this can take up to 3 years.[^fm26] In small studies, embolization eased night pain within weeks. None of these studies had a comparison group.[^okunofs][^allaw] Rare serious problems, such as brief loss of vision, have been reported.[^fm26]",
  "The doctor finder on this page lists doctors who perform knee embolization. It does not show who treats other joints.",
]

[[sections]]
id = "what"
place = "after"
heading = "What is arthritis of the knee?"
text = [
  "In arthritis, the cushion between the bones wears away. The bones can rub together. This causes pain, swelling, and stiffness.[^mpoa] Arthritis is the most common disease of the knee.[^mpknee]",
  "Pain is often worse when you walk or put weight on the knee. Stiffness after waking often lasts 30 minutes or less. Later, pain can come even at rest or wake you at night.[^mpoa] See a doctor if your symptoms bother you or get worse.[^mpoa]",
]

[[sections]]
id = "ask"
place = "after"
heading = "What should I ask my doctor?"
list = [
  "Which options could work for me, and which could not?",
  "What has my knee X-ray shown?",
  "How long would I need to recover?",
  "Do you offer knee embolization, or can you refer me to someone who does?",
]

[[faq]]
q = "Do I need treatment?"
a = "Not always. Many people manage with exercise, weight loss if needed, and pain relievers. These treatments cannot make arthritis go away, but they can often delay surgery.[^mpoa]"

[[faq]]
q = "Does embolization fix the arthritis?"
a = "No. It aims to ease pain. The worn cushion in the joint is still there.[^ucla] Scans have not shown that it slows the arthritis.[^genesis][^vz26]"

[[faq]]
q = "Can I still have a knee replacement later?"
a = "Yes. In one small study, 9 people later had a knee replacement. Their surgeons reported no extra difficulty.[^genesis]"

[[faq]]
q = "Do I need a knee replacement?"
a = "Not always. It is usually for severe arthritis when other treatments no longer help.[^mpoa][^tkr] Many people try exercise, medicines, or injections first. Some also consider embolization."

[[options]]
id = "exercise"
name = "Exercise and weight loss"
what = "Exercise and physical therapy build strength and keep the knee moving. Losing weight, if you are overweight, takes stress off the knee.[^mpoa]"
invasive = "No procedure is needed. A physical therapist can show you what to do.[^mpoa]"
works = "Staying active helps keep the joint moving.[^mpoa] In one study, people who lost about 1 out of 10 pounds of body weight with diet and exercise had less pain than with exercise alone.[^idea] If physical therapy has not helped after 6 to 12 weeks, it likely will not.[^mpoa]"
side = "Pain can make it hard to keep active. Ask your doctor for an exercise routine.[^mpoa]"

[[options]]
id = "pain-relievers"
name = "Pain relievers"
what = "These include acetaminophen and anti-inflammatory pills like ibuprofen and naproxen. Creams that go on the skin are another option.[^mpoa]"
invasive = "These are pills or creams. No procedure is needed."
works = "They can ease pain. They do not fix the knee.[^mpoa]"
side = "Do not take more than 4,000 mg of acetaminophen a day.[^mpoa] Anti-inflammatory pills can raise the risk of heart attack, stroke, and stomach bleeding. Talk with your doctor before taking them often.[^ibu][^mpoa]"

[[options]]
id = "other-medicines"
name = "Other medicines"
what = "Duloxetine is a prescription pill that can help long-term arthritis pain.[^mpoa]"
invasive = "These are pills. No procedure is needed."
works = "It can help some people with long-term pain.[^mpoa]"
side = "Ask your doctor about side effects. Strong opioid pain pills are not usually advised for arthritis.[^aaos]"

[[options]]
id = "embolization"
name = "Knee artery embolization (GAE)"
what = "Genicular artery embolization (GAE) is a newer treatment for knee arthritis pain. Tiny particles slow extra blood flow to the lining of the knee. The idea is to calm swelling and ease pain.[^bsir][^ucla] You keep your own knee."
invasive = "You only need a tiny skin nick, usually in the groin. You stay awake with medicine to help you relax.[^bsir][^ucla] It takes about 1 to 2 hours. Most people go home the same day.[^ucla][^bsir] Relief often starts within about two weeks.[^ucla]"
works = "Many people feel better in studies without a comparison group.[^amin] In one study of moderate to severe arthritis, about half had their symptoms cut in half two years later.[^cus24]\nSome studies compared it with a fake procedure. In a small one, embolization worked better after one month.[^bagla] In the two largest, people who had the fake procedure also felt much better. Embolization was not clearly better than the fake procedure at 4 months or at one year.[^landers][^vz24][^vz26]\nSo doctors do not yet know how much of the relief comes from the procedure itself. Larger studies are under way.[^gen2][^bsir]"
side = "You may have bruising where the tube went in.[^bsir] About 1 to 2 out of 10 people get a patchy skin color change over the knee. It usually fades on its own.[^ashraf][^amin][^bsir] Rarely, the skin over the knee can break down into a sore. This usually heals without treatment.[^bsir] Serious problems were rare in studies.[^bagla][^landers][^vz24]"

[[options]]
id = "steroid"
name = "Steroid shot"
what = "A steroid medicine is injected into the knee.[^mpoa]"
invasive = "It is a shot given during an office visit."
works = "It often eases pain for a while.[^mpoa] In studies, the benefit got smaller by about 3 months.[^juni] Repeat shots every 3 months for 2 years did not ease pain more than salt water.[^mcalindon]"
side = "Repeat shots caused slightly more loss of the knee cushion than salt water shots.[^mcalindon]"

[[options]]
id = "hyaluronic"
name = "Gel shots (hyaluronic acid)"
what = "A gel is injected into the knee. It aims to replace the joint fluid that thins with arthritis.[^cus26]"
invasive = "They are shots given during office visits."
works = "In a large review of studies, they eased pain about as much as a fake shot.[^pereira]"
side = "Serious problems were more common than with a fake shot.[^pereira] The knee can be sore or swollen for a short time.[^cus26]"

[[options]]
id = "prp"
name = "Platelet-rich plasma (PRP)"
what = "Platelets from your own blood are injected into the knee.[^cus26]"
invasive = "Blood is drawn and the shots are given during office visits.[^restore]"
works = "In a large careful study, people felt about as much better as those given salt water shots at one year.[^restore] Other studies have found some benefit.[^cus26]"
side = "In studies, side effects were mild and short-lived.[^cus26]"

[[options]]
id = "nerve-ablation"
name = "Nerve ablation"
what = "Heat quiets the nerves that carry pain from the knee.[^cus26]"
invasive = "Ask your doctor how it is done and how long recovery takes."
works = "In one study, about 7 out of 10 people had their pain cut in half at 6 months. That was much more than with one steroid shot. This study did not compare it with a fake procedure.[^davis] Nerves can grow back, so pain can return.[^cus26]"
side = "No serious problems from the procedure were seen in that study.[^davis]"

[[options]]
id = "knee-replacement"
name = "Knee replacement"
what = "Surgery removes the worn cartilage and bone. Metal and plastic parts replace them.[^tkr]"
invasive = "Surgery takes 1 to 2 hours. Most people leave the hospital in 1 to 4 days.[^tkr][^nhsrec] Most daily activities return in 3 to 6 weeks. Full recovery can take several months.[^tkr][^nhsrec]"
works = "It works well for many people. More than 9 out of 10 new knees still work well 15 years later.[^tkr] About 1 out of 5 people were not satisfied in one large study.[^bourne]"
side = "Serious problems, like a knee infection, happen in less than 2 out of 100 people.[^tkr] Some people have ongoing pain or stiffness.[^nhscomp]"

[[options]]
id = "partial-replacement"
name = "Partial knee replacement"
what = "Surgery replaces only the worn part of the knee.[^mpoa]"
invasive = "Recovery should be shorter than after a full replacement. You may drive again after about 3 weeks instead of 6.[^nhsrec]"
works = "It replaces only part of the knee.[^mpoa] Ask your surgeon whether your knee fits."
side = "Infection, blood clots, and ongoing pain or stiffness can happen after knee replacement.[^nhscomp]"

[[options]]
id = "osteotomy"
name = "Bone realignment (osteotomy)"
what = "Surgery reshapes a leg bone to take weight off the worn part of the knee.[^mpoa]"
invasive = "It is surgery on the bone near the knee.[^mpoa]"
works = "It is an option for some people with severe arthritis.[^mpoa]"
side = "Ask your surgeon about its risks and how long recovery takes."

[[options]]
id = "scope"
name = "Knee scope clean-out"
what = "A camera and small tools wash out or trim the inside of the knee.[^mpoa][^moseley]"
invasive = "It is surgery done through the skin with a camera.[^mpoa]"
works = "In a careful study, it did no better than a fake surgery for knee arthritis.[^moseley] A major guideline advises against it for knee arthritis.[^aaos]"
side = "Ask your surgeon about its risks."

