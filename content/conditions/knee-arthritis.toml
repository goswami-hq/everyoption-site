[[faq]]
q = "Do I need treatment?"
a = "Not always. Many people manage with exercise, weight loss if needed, and pain relievers. These treatments cannot make arthritis go away, but they can often delay surgery.[^mpoa]"

[[faq]]
q = "Does embolization fix the arthritis?"
a = "No. It aims to ease pain. The worn cushion in the joint is still there.[^ucla] Scans have not shown that it slows the arthritis.[^genesis]"

[[faq]]
q = "Can I still have a knee replacement later?"
a = "Yes. GAE does not seem to make a later knee replacement harder, but doctors are still checking.[^sir26]"

[[faq]]
q = "Do I need a knee replacement?"
a = "Not always. It is usually for severe arthritis when other treatments no longer help.[^mpoa][^tkr] Many people try exercise, medicines, or injections first. Some also consider embolization. Many people who could have a knee replacement try a full non-surgery program first and still have not had surgery 2 years later.[^skou18]"

[[options]]
id = "exercise"
name = "Exercise and weight loss"
what = "Exercise and physical therapy build strength and keep the knee moving. Losing weight, if you are overweight, takes stress off the knee.[^mpoa]"
invasive = "No procedure is needed. A physical therapist can show you what to do.[^mpoa]"
works = "Good evidence suggests exercise helps you use your knee better. It may also ease pain a little.[^lawford] If you are overweight, losing weight with diet and exercise can ease pain more than exercise alone.[^idea]"
side = "Pain can make it hard to keep active. Ask your doctor for an exercise routine.[^mpoa]"

[[options]]
id = "pain-relievers"
name = "Pain relievers"
what = "These include acetaminophen and anti-inflammatory pills like ibuprofen and naproxen. Creams that go on the skin are another option.[^mpoa]"
invasive = "These are pills or creams. No procedure is needed."
works = "Strong evidence shows anti-inflammatory pills ease knee pain. Anti-inflammatory gels on the skin also help some people, with fewer side effects.[^dacosta21] Acetaminophen helps very little.[^machado] None of these fix the knee.[^mpoa]"
side = "Do not take more than 4,000 mg of acetaminophen a day.[^mpoa] Anti-inflammatory pills can raise the risk of heart attack, stroke, and stomach bleeding. Talk with your doctor before taking them often.[^ibu][^mpoa]"

[[options]]
id = "other-medicines"
name = "Other medicines"
what = "Duloxetine is a prescription pill that can help long-term arthritis pain.[^mpoa] Opioid pain pills, including tramadol, are another kind of prescription pill."
invasive = "These are pills. No procedure is needed."
works = "Good evidence suggests duloxetine eases long-term knee pain a little.[^bhandari] Opioid pills ease arthritis pain only slightly.[^dacosta14][^toupin]"
side = "Side effects make some people stop duloxetine.[^bhandari] Opioid pills cause more side effects than they are worth for most people with arthritis.[^dacosta21][^dacosta14]"

[[options]]
id = "embolization"
name = "Knee artery embolization (GAE)"
# "What is <procedure>?" answer block (agreed list item 1, his "Agree" 2026-11-07; his GAE name, item 14); the skin-nick line left `invasive`
lead_heading = "What is genicular (knee) artery embolization (GAE)?"
what = "Genicular (knee) artery embolization (GAE) is a newer treatment for knee arthritis pain.[^bsir][^ucla] A thin tube goes through a tiny skin nick, usually in the groin.[^bsir][^ucla] Tiny particles slow extra blood flow to the lining of the knee to calm swelling and pain.[^bsir][^ucla] You keep your own knee. It aims to ease pain; it does not fix the arthritis.[^ucla]"
invasive = "You stay awake, with medicine to help you relax. You go home the same day.[^bsir][^ucla] Relief often starts within about two weeks.[^ucla]"
works = "Early results are encouraging.[^amin] Many people feel better, and for some the relief lasts at least two years.[^sir26][^cus24] Doctors are still learning how much of this relief comes from the treatment itself.[^lanza] Larger trials are under way.[^gen2] If GAE works for you, it may help you put off a knee replacement, but we don't know that yet.[^singh26]\nThe Society of Interventional Radiology says GAE should be offered to people whose knee pain has not improved with other treatments, or who cannot have, do not want, or want to delay a knee replacement.[^sir26]"
side = "You may have a bruise where the tube went in.[^bsir] A patchy color change or redness on the skin over the knee is fairly common: about 1 to 3 out of 10 people get it. It usually fades within a month.[^sir26][^ashraf][^amin] Some people get a small skin sore over the knee. It usually heals on its own.[^sir26][^padia] A few people have numbness or tingling in the lower leg, and it can last for months.[^vz26] Serious problems are rare.[^sir26]"

[[options]]
id = "steroid"
name = "Steroid shot"
what = "A steroid medicine is injected into the knee.[^mpoa]"
invasive = "It is a shot given during an office visit."
works = "Studies disagree on how much a steroid shot helps. It often eases pain for a while, but the relief usually fades by about 3 months.[^mpoa][^juni] Getting shots again and again does not seem to give more relief.[^mcalindon] Physical therapy may help more than shots over a year.[^deyle]"
side = "Repeat shots may wear down the knee cushion a little faster.[^mcalindon] If you are planning a knee replacement, tell your surgeon about any recent shot.[^yang22]"

[[options]]
id = "hyaluronic"
name = "Gel shots (hyaluronic acid)"
what = "A gel is injected into the knee. It aims to replace the joint fluid that thins with arthritis.[^cus26]"
invasive = "They are shots given during office visits."
works = "Strong evidence shows gel shots ease pain only slightly more than fake shots, too little for most people to notice.[^pereira]"
side = "Serious problems are a bit more common than with fake shots.[^pereira] The knee can be sore or swollen for a short time.[^cus26]"

[[options]]
id = "prp"
name = "Platelet-rich plasma (PRP)"
what = "Platelets from your own blood are injected into the knee.[^cus26]"
invasive = "Blood is drawn and the shots are given during office visits.[^restore]"
works = "Studies disagree on whether PRP helps. It may ease pain for up to 6 months.[^auroux] By one year, it may do no better than a salt water shot.[^restore]"
side = "Side effects are usually mild and short-lived. The knee can be sore or swollen for a short time.[^restore]"

[[options]]
id = "nerve-ablation"
name = "Nerve ablation"
what = "Heat quiets the nerves that carry pain from the knee.[^cus26]"
invasive = "Ask your doctor how it is done and how long recovery takes."
works = "Studies disagree on whether it helps. It may ease pain for about 3 months. Longer relief has not been shown.[^almeida][^malaithong]"
side = "Serious problems seem no more common than with a fake procedure.[^almeida]"

[[options]]
id = "knee-replacement"
name = "Knee replacement"
what = "Surgery removes the worn cartilage and bone. Metal and plastic parts replace them.[^tkr]"
invasive = "Surgery takes 1 to 2 hours. Most people leave the hospital in 1 to 4 days.[^tkr][^nhsrec] Most daily activities return in 3 to 6 weeks. Full recovery can take several months.[^tkr][^nhsrec]"
works = "Strong evidence shows most new knees last a long time. About 8 out of 10 still have their original parts 25 years later.[^evans] For moderate to severe arthritis, a knee replacement can ease pain more than non-surgery care.[^skou15] About 1 to 2 out of 10 people are not satisfied with their new knee.[^bourne][^defrance]"
side = "Serious problems, like a knee infection, are uncommon: fewer than 2 out of 100 people.[^tkr] Serious problems are more likely with surgery than without it.[^skou15] Some people have ongoing pain or stiffness.[^nhscomp]"

[[options]]
id = "partial-replacement"
name = "Partial knee replacement"
what = "Surgery replaces only the worn part of the knee.[^mpoa]"
invasive = "Recovery should be shorter than after a full replacement. You may drive again after about 3 weeks instead of 6.[^nhsrec]"
works = "It is an option when only one part of the knee is worn.[^topkat] Five years later, results are about the same as with a full replacement.[^topkat] A partial knee is more likely to need redoing later on.[^evans]"
side = "Infection, blood clots, and ongoing pain or stiffness can happen after knee replacement.[^nhscomp]"

[[options]]
id = "osteotomy"
name = "Bone realignment (osteotomy)"
what = "Surgery reshapes the shin bone to shift weight off the worn inner side of the knee. It is mainly for younger, active people with bow legs.[^loke][^birmingham]"
invasive = "It is surgery on the bone near the knee.[^mpoa]"
works = "Early studies suggest it eases symptoms more than non-surgery care.[^birmingham] About 1 out of 10 people have a knee replacement more than 10 years later.[^loke]"
side = "Ask your surgeon about its risks and how long recovery takes."

[[options]]
id = "scope"
name = "Knee scope clean-out"
what = "A camera and small tools wash out or trim the inside of the knee.[^mpoa][^moseley]"
invasive = "It is surgery done through the skin with a camera.[^mpoa]"
works = "Strong evidence shows a knee scope clean-out does not help knee arthritis.[^moseley][^kirkley] A major guideline advises against it for knee arthritis.[^aaos]"
side = "It carries the risks of surgery, such as blood clots and infection.[^thorlund]"

