[lead_pair]
heading = "About pelvic vein treatments: embolization and stenting"
intro = "Two vein problems can cause this pain, and they often happen together. Veins near the ovaries and uterus can widen and let blood flow the wrong way. A large vein in the pelvis can also be squeezed by an artery, which is often called May-Thurner syndrome. Each problem has its own treatment. Both are done through a tiny skin nick, without surgery, and nothing is cut out of your body. Some women need one treatment, and some need both.[^desai][^alenichev][^mokhtar][^razavi][^kibbe]"
[[lead_pair.parts]]
heading = "Embolization: closing the wide veins"
embolization_fold = true
text = [
  "A doctor guides a thin tube through a tiny skin nick to the wide veins near the ovaries and uterus. Tiny coils, plugs, a medical glue, or a medicine then close those veins.[^strobl]",
]
[[lead_pair.parts]]
heading = "Stenting: opening a squeezed vein (May-Thurner syndrome)"
text = [
  "A doctor guides a thin tube through a tiny skin nick to the squeezed vein and places a stent, a small mesh tube, to hold it open. The stent stays in for good.[^desai]",
]
[[lead_pair.parts]]
heading = "How well do they work?"
text = [
  "**Embolization.** Early results are encouraging. About 3 out of 4 women have much less pain soon after embolization, and for many the relief lasts for years. In the one trial that compared embolization with a fake procedure, embolization eased pain more. More research is under way. It is an option to look into if you have not found relief with anything else.[^strobl][^hanna][^kim06][^laborda][^hansrani][^embolize][^daniels]",
  "**Stenting.** Early studies suggest a stent eases pelvic pain for women whose pain comes from a squeezed vein, and that when both vein problems are present, treating both gives more lasting relief than a stent alone.[^alenichev][^mokhtar][^razavi][^kibbe]",
]
[[lead_pair.parts]]
heading = "Side effects"
text = [
  "**Embolization.** Pain in the belly or back right afterward is common. Serious problems are possible, but rare: about 1 out of 100. Most of these are fixed with another procedure. Pain may come back for some women. Some may need a second treatment.[^hanna][^sutanto]",
  "**Stenting.** Back pain after a stent is common. A clot in the stent or the stent moving is rare, about 1 to 2 out of 100. Doctors may suggest a blood thinner during a later pregnancy.[^wenda][^villalba]",
]

