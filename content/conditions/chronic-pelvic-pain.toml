[[sections]]
id = "what"
# place = "box": the "What is <condition>?" box (job platform-main-0024, the fibroid pattern; docs/condition-pattern.md).
# From the old "What is it?" section, with its sources. Two new sentences (listed for him in ai-hq
# projects/platform/design/rest-of-pages-2026-11-07/list-for-him.md): the 6-month definition [^ahangari] and the
# see-a-doctor line, which restates the page's "more than one cause" sentence [^zlotnik][^beard91].
place = "box"
heading = "What is pelvic venous disease (pelvic congestion syndrome)?"
# Kept short, as on fibroids (design review 2026-11-07: 12 lines at 390 was clutter); the vein detail is the next section.
text = [
  "Pelvic pain that lasts more than 6 months is called chronic pelvic pain. Sometimes it comes from veins in the pelvis that are wide or squeezed. Doctors call this pelvic venous disease. You may also hear the name pelvic congestion syndrome, or May-Thurner syndrome when a large vein is squeezed. It is most common in women before menopause who have been pregnant.[^ahangari][^svp][^krambeck]",
]
symptoms_label = "Common symptoms"
symptoms = ["A dull ache", "Worse when you stand", "Worse late in the day", "Worse after sex", "Worse before your period"]
symptoms_cite = "[^krambeck]"
see_doctor_heading = "When to see a doctor"
see_doctor = "See a doctor about pelvic pain that keeps coming back. Pelvic pain often has more than one cause, such as endometriosis, and a doctor can check for each one.[^zlotnik][^beard91]"

[[sections]]
id = "veins"
place = "after"
heading = "How can veins cause pelvic pain?"
text = [
  "Veins carry blood back to the heart. In the pelvis, veins near the ovaries and uterus can widen and let blood flow the wrong way. A large vein can also be squeezed by an artery, so blood backs up into the pelvic veins. A vein near the kidney can be squeezed too. Doctors now group these vein problems together.[^svp]",
]

[[sections]]
id = "found"
place = "after"
heading = "How is it found?"
text = [
  "Doctors may use an ultrasound, a CT or MRI scan, or a dye test of the veins called a venogram.[^krambeck][^zlotnik][^jurga]",
  "Wide or squeezed veins also show up on scans in some women who have no pain. So your doctor looks at your scans and your symptoms together.[^zlotnik][^beard91][^kibbe][^jurga][^rozenblit]",
]

[[sections]]
id = "ask"
place = "after"
heading = "What should I ask my doctor?"
list = [
  "Could the veins in my pelvis be part of my pain?",
  "Could something else, such as endometriosis, also be part of it?",
  "Which options could work for me, and which could not?",
  "Do you offer pelvic vein embolization and stenting, or can you refer me to someone who does?",
]

[[faq]]
q = "Do I need treatment?"
a = "Not always. If pain limits your life, talk with your doctor about medicines first. Procedures are an option when medicines do not help.[^lepennec][^baccellieri]"

[[faq]]
q = "Does the pain stop after menopause?"
a = "This is often said, but it has not been well studied.[^bartl]"

[[faq]]
q = "Can I get pregnant after treatment?"
a = "Little is known about pregnancy after embolization. Some women have become pregnant afterward. After a stent, doctors may suggest a blood thinner during pregnancy. Removing the uterus ends the chance of pregnancy.[^beard91][^kim06][^villalba][^daniels]"

[[options]]
id = "hormones"
name = "Hormone medicines"
what = "These are hormone pills or shots. Your doctor prescribes them.[^cheong]"
invasive = "No procedure is needed."
works = "Good evidence suggests they ease pain while you take them. However, pain often comes back after you stop.[^cheong][^farquhar]"
side = "Weight gain and bloating are common.[^cheong]"

[[options]]
id = "vein-pills"
name = "Vein pills (flavonoids)"
what = "These are plant-based pills used for vein problems.[^gloviczki]"
invasive = "No procedure is needed."
works = "Early studies suggest they may ease pain.[^gloviczki]"
side = "Side effects are few. Some people get a headache, nausea, or an upset stomach.[^venotreat]"

[[options]]
id = "embolization"
name = "Pelvic vein embolization"
what = "A doctor guides a thin tube into the wide pelvic veins. Tiny coils, plugs, or a medicine close those veins.[^strobl]"
invasive = "It is done through a tiny skin nick.[^strobl]"
works = "Early results are encouraging. Many women have less pain, and for some the relief lasts several years.[^hanna][^strobl][^kim06][^laborda] Doctors are still learning how much of this relief comes from the treatment itself.[^hanna] More research is under way.[^embolize] If embolization works for you, it may help you avoid surgery to remove your uterus and ovaries, but we don't know that yet."
side = "Pain in the belly or back right afterward is common. Serious problems are possible, but rare: about 1 out of 100. Most of these are fixed with another procedure.[^hanna] Pain may come back for some women. Some may need a second treatment.[^sutanto]"

[[options]]
id = "stent"
name = "Opening a squeezed vein with a stent"
what = "If a large vein in the pelvis is squeezed, a doctor can place a stent, a small mesh tube, to hold it open. The stent stays in for good.[^desai]"
invasive = "It is done through a tiny skin nick. Nothing is cut out of your body.[^desai]"
works = "Studies disagree on how often a stent alone eases pelvic pain. Some women also need embolization afterward.[^alenichev][^mokhtar] Most of what we know about stents is about leg pain and swelling, not pelvic pain.[^razavi] A squeezed vein is common in people with no symptoms, so it is not always the cause.[^kibbe]"
side = "Back pain after a stent is common. A clot in the stent or the stent moving is rare, about 1 to 2 out of 100.[^wenda] Doctors may suggest a blood thinner during a later pregnancy.[^villalba]"

[[options]]
id = "hysterectomy"
name = "Removing the uterus and ovaries"
what = "A surgeon removes the uterus and both ovaries.[^beard91]"
invasive = "This is major surgery."
works = "Early studies suggest it can ease pain. However, about 1 out of 3 women may still have some pain afterward.[^beard91]"
side = "You can no longer get pregnant. Removing both ovaries causes menopause, so doctors often give hormone replacement. It has the risks of any major surgery.[^beard91]"
[[options]]
id = "vein-surgery"
name = "Surgery to close the ovarian vein"
what = "A surgeon ties off and cuts the wide ovarian vein.[^emad]"
invasive = "This is surgery."
works = "Early studies suggest it can ease pain about as much as embolization.[^emad]"
side = "It has the risks of any surgery."

