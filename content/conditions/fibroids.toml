title = "Fibroids: Every Treatment Option | Every Option"
description = "Fibroids are common, non-cancerous growths in the uterus. Learn how invasive each treatment is, how well it works, and its side effects."
h1 = "What are my options for fibroids?"
answer = "Fibroids are non-cancerous growths in the uterus. Many cause no symptoms and need no treatment.[^mpfib] When they cause heavy periods, pain, or pressure, your options fall into three groups: medicines, minimally invasive treatments, and surgery.[^mpfib] The right choice depends on your symptoms and goals."
urgent = "If you have severe bleeding, severe pain, a fever, or feel very sick or faint, call 911."
