[[sections]]
id = "what"
place = "after"
heading = "What are fibroids?"
text = [
  "Fibroids are muscle growths in or on the wall of the uterus. They are very common: by age 50, between 2 and 8 in 10 women have them.[^owh]",
  "Symptoms can include heavy or long periods, tiredness from blood loss, pelvic pain or pressure, frequent urination, and pain during sex.[^mpfib][^owh] See a doctor if you have any of these, or if you soak through a pad or tampon every hour for 2 to 3 hours.[^mpbleed]",
]

[[sections]]
id = "ask"
place = "after"
heading = "What should I ask my doctor?"
list = [
  "Which options could work for me, and which could not?",
  "How would each option affect a future pregnancy?",
  "How long would I need to recover?",
  "Do you offer embolization, or can you refer me to someone who does?",
]

[[faq]]
q = "Do I need treatment?"
a = "Not always. Fibroids that cause no symptoms or only mild ones can simply be watched with exams or an ultrasound. They often shrink after menopause.[^mpfib][^owh]"

[[faq]]
q = "Are fibroids cancer?"
a = "No. Rarely, a growth that looks like a fibroid is a hidden cancer. Estimates differ: less than 1 in 1,000,[^owh] or about 1 in 225 to 1 in 580 people who have fibroid surgery.[^fdamorc]"

[[faq]]
q = "Can I get pregnant after treatment?"
a = "It depends on the treatment. Myomectomy and removal through the cervix can be good choices if you want children.[^acr][^ccmyo] Pregnancies happen after embolization, but experts disagree on its use if you plan a pregnancy.[^mpuae][^acr] Pregnancy is not possible after a hysterectomy and can be dangerous after endometrial ablation.[^ccmyo][^fdaea]"

[[faq]]
q = "Do I need a hysterectomy for fibroids?"
a = "Not always. Many people never need one. It is the only treatment that keeps fibroids from returning, but medicines, minimally invasive treatments, and surgery that removes only the fibroids are all options.[^mpfib][^owh]"

[[options]]
id = "non-hormone-medicines"
name = "Medicines without hormones"
what = "Tranexamic acid, taken only on period days, plus pain relievers and iron.[^mpfib][^txa][^owh]"
invasive = "Not invasive. These are pills."
works = "They ease bleeding and cramps but do not treat the fibroids, so symptoms return when you stop.[^mpfib][^txa]"
side = "Tranexamic acid can rarely cause blood clots.[^txa]"

[[options]]
id = "hormone-medicines"
name = "Hormone medicines"
what = "Birth control pills or shots, daily pills that lower hormones, and short-term shots before surgery.[^mpfib][^lupron]"
invasive = "Not invasive. These are pills or shots."
works = "Daily hormone-lowering pills greatly reduced bleeding for about 7 in 10 people.[^liberty] Symptoms often return after stopping.[^owh]"
side = "Hot flashes. Some weaken bones, so use is limited. Not for people who have had blood clots.[^oriahnn][^myfembree][^lupron]"

[[options]]
id = "iud"
name = "Hormone IUD"
what = "A small device placed in the uterus that thins the lining, for up to 5 years.[^owh][^mirena]"
invasive = "Minimal. Placed during an office visit."
works = "Lightens periods but does not treat the fibroids.[^owh]"
side = "Spotting at first. It is more likely to slip out when fibroids are present.[^obg]"

[[options]]
id = "embolization"
name = "Fibroid embolization (UFE)"
what = "A thin tube delivers tiny beads that block blood flow to the fibroids, so they shrink.[^sir][^mpfib]"
invasive = "A tiny skin nick at the wrist or groin. Most people go home the same day and are back to normal in 7 to 10 days.[^sir][^mpuae]"
works = "About 9 in 10 women have significant improvement.[^sir] About 1 in 3 needed more treatment within 5 years.[^rest]"
side = "Cramps, nausea, and low fever for 2 to 7 days. Early menopause in 1 to 5 in 100, more often over age 45.[^sir][^rinfo]"

[[options]]
id = "radiofrequency"
name = "Radiofrequency ablation"
what = "Heat from a small needle destroys the fibroid.[^mpfib]"
invasive = "Small cuts in the belly, or through the vagina with no cuts. Most people go home the same day.[^sonata3][^halt]"
works = "Results vary: about 1 in 11 needed surgery within 3 years in one study, and about 2 in 5 within 2 years in another.[^sonata3][^dutch]"
side = "Pain and cramps. Serious problems were rare in studies.[^sonata3][^dutch]"

[[options]]
id = "focused-ultrasound"
name = "Focused ultrasound"
what = "Beams of sound, guided by an MRI scanner, heat and shrink the fibroid.[^rinfo]"
invasive = "No cut. Most people recover quickly.[^rinfo]"
works = "Fits only some fibroids, and some people need more treatment later. Not all insurance covers it.[^rinfo][^fdapma][^bcbsnc]"
side = "Belly pain and skin burns or bruises that usually heal in a week or two.[^rinfo]"

[[options]]
id = "endometrial-ablation"
name = "Endometrial ablation"
what = "Heat or cold destroys the lining of the uterus to lighten periods.[^mpea]"
invasive = "No cuts. Most people go home the same day and recover in 1 to 2 days.[^mpea]"
works = "Treats the lining, not the fibroids, which stay in place. Experts disagree on using it for fibroids.[^mpfib][^acr]"
side = "Cramps and discharge for a while. Not for anyone who may want a future pregnancy.[^mpea][^fdaea]"

[[options]]
id = "hysteroscopic"
name = "Removal through the cervix"
what = "A thin camera and small tools remove fibroids growing inside the uterus.[^mpfib][^mphysteroscopy]"
invasive = "No cuts. Recovery takes a few days.[^ccmyo]"
works = "Works only for fibroids inside the uterus. New fibroids can form later.[^mpfib][^owh]"
side = "Cramps and light bleeding for a few days. Heavy bleeding, infection, or a tear in the uterus are rare.[^mphysteroscopy]"

[[options]]
id = "myomectomy"
name = "Myomectomy"
what = "Surgery that removes the fibroids and leaves the uterus.[^mpfib]"
invasive = "A larger cut in the belly or a few small cuts. Recovery takes about 2 to 6 weeks.[^ccmyo]"
works = "Removes the fibroids you have, but new ones can grow.[^mpfib][^ccmyo]"
side = "Bleeding, infection, blood clots, and harm to nearby organs, which are not common.[^ccmyo]"

[[options]]
id = "hysterectomy"
name = "Hysterectomy"
what = "Surgery that removes the whole uterus.[^mphyst]"
invasive = "Through the vagina, small cuts, or a larger cut in the belly. Recovery takes about 2 to 6 weeks.[^mphyst]"
works = "The only treatment that keeps fibroids from returning. Periods stop.[^owh][^ccmyo]"
side = "Bleeding, infection, blood clots, and harm to nearby organs. Menopause begins if the ovaries are also removed.[^mphyst]"

