finder_heading = "Shrink fibroids without surgery"
finder_intro = "Fibroid embolization works through a tiny skin nick. Your uterus stays in place. Most people go home the same day.\nRecovery takes **about 1 week** instead of 2 to 6 weeks after major surgery."
finder_how = "#embolization"
