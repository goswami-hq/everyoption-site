[[faq]]
q = "Do fibroids go away on their own?"
a = "Sometimes. Many do not grow and need no care. They often shrink after menopause, when periods stop for good.[^mpfib][^owh]"

[[faq]]
q = "Are fibroids cancer?"
a = "No. Fibroids are not cancer. Rarely, a growth that looks like a fibroid is a hidden cancer. Estimates differ: less than 1 in 1,000,[^owh] or about 1 in 225 to 1 in 580 people who have fibroid surgery.[^fdamorc]"

[[faq]]
q = "Can I get pregnant if I have fibroids?"
a = "Yes, most people can. Big fibroids can sometimes cause problems in pregnancy. Tell your doctor if you want a baby later.[^ccfib]"

[[faq]]
q = "Do I need a hysterectomy for fibroids?"
a = "Not always. Many people never need one. There are pills, procedures that keep the uterus, and surgery that removes only the fibroids. A hysterectomy is the only treatment that makes sure fibroids cannot come back.[^mpfib][^owh]"

[[faq]]
q = "What is the least invasive treatment for fibroids?"
a = "Watching and waiting, medicines and a hormone IUD need no procedure. Some procedures need no cuts or only a tiny nick: focused ultrasound, embolization, removal through the cervix, endometrial ablation, and one kind of radiofrequency ablation. Each fits some people and not others.[^mpfib][^rinfo][^sir]"

[[faq]]
q = "Who does fibroid embolization?"
a = "An interventional radiologist. This is a doctor who treats problems through tiny tubes, using X-rays to see.[^sir] You can [find one near you](/ufe/)."

[[faq]]
q = "How long does it take to recover?"
a = "It depends on the choice. Medicines need no recovery. Most people are back to normal 7 to 10 days after embolization.[^mpuae] Surgery can take 2 to 6 weeks.[^ccmyo][^mphyst]"

