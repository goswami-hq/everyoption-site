title = "Fibroids: every treatment option, explained simply | Every Option"
description = "Fibroids are common growths in the womb. See every treatment option side by side, from watching and waiting to medicines, embolization and surgery, in plain words."
h1 = "What are my options for fibroids?"
answer = "Fibroids are growths in the uterus (womb). They are not cancer. Many cause no problems and need no care.[^mpfib] If they cause heavy periods, pain or pressure, you have many choices. Some are pills. Some are procedures that keep the uterus. Surgery is one choice too.[^mpfib] The best one depends on you."
finder_button = "Find a doctor for fibroid embolization"

compare_heading = "How do the options compare?"
compare_intro = "Here is a quick look at each choice. Tap a name to read more. The answers are for most people. Your doctor can tell you what fits you."
compare_note = "“Back to normal” is a typical time after a procedure. It can be longer or shorter for you."

options_heading = "What are all the options?"
options_intro = "They start with the gentlest. Not every choice is right for every person. Each one answers the same eight questions. Some use hormones, the body’s chemical messengers."

faq_heading = "Common questions"
find_heading = "Where can I find a doctor?"
find_text = [
  "A gynecologist (a doctor for women’s health) can talk with you about pills and surgery. An interventional radiologist does fibroid embolization. This is a doctor who treats problems through tiny tubes, using X-rays to see.[^sir]",
  "Our free [finder for fibroid embolization](/ufe/) lists doctors near you. It is not a ranking. Call the office and ask if it is right for you.",
]
not_advice = "Education, not medical advice. Talk to your doctor about your own care."

[[sections]]
id = "what"
heading = "What are fibroids?"
text = [
  "Fibroids are lumps made of muscle. They grow in or on the wall of the uterus.[^owh] They are very common. By age 50, between 2 and 8 in 10 women have them.[^owh] In one large study, more than 8 in 10 Black women and about 7 in 10 white women had them by 50.[^baird]",
  "Fibroids can be one or many. They can be small or big. Some grow inside, some in the wall, and some on the outside.[^mpfib] Where they are helps decide which choices fit.",
  "Fibroids often shrink after menopause, when periods stop for good.[^mpfib][^owh]",
]

[[sections]]
id = "signs"
heading = "What are the signs? When should I see a doctor?"
text = ["Many people with fibroids feel nothing.[^mpfib] When there are signs, they can be:"]
list = [
  "Heavy periods, sometimes with clots, or periods that last longer.[^mpfib]",
  "Bleeding between periods.[^mpfib]",
  "Feeling tired from losing blood. This is called anemia, which means a low blood count.[^owh]",
  "Pain or cramps, or pressure or fullness low in the belly.[^mpfib]",
  "Needing to pee a lot, or trouble with poop.[^mpfib][^owh]",
  "Pain during sex.[^mpfib]",
]
after = ["See a doctor if you have any of these signs. Also call if you soak through a pad or tampon every hour for 2 to 3 hours, or if bleeding makes you weak or lightheaded.[^mpbleed]"]

[[sections]]
id = "urgent"
kind = "urgent"
heading = "When should I get help right away?"
text = ["**Call 911** if you pass out.[^kp]", "**Call your doctor now or get care right away** if:[^kp]"]
list = [
  "You have very heavy bleeding.[^kp]",
  "You feel dizzy or lightheaded, or feel like you might faint.[^kp]",
  "You have new or worse pain in your belly or pelvis.[^kp]",
]
after = ["If you are pregnant or might be and you are bleeding, call your doctor.[^mpbleed]"]

[[options]]
id = "watching"
name = "Watching and waiting"
heading = "Watching and waiting"
what = "You do not treat the fibroids now. You keep an eye on them.[^mpfib]"
how = "Your doctor checks them with exams or an ultrasound, a scan that uses sound waves.[^mpfib]"
good = "Fibroids that cause no problems, or mild signs you can live with.[^owh]"
not_for = "Heavy bleeding, low blood count or pain that is hard to live with."
recovery = "None. There is nothing to recover from."
pregnancy = "Yes. Watching does not change this. Big fibroids can sometimes cause problems in pregnancy.[^ccfib]"
come_back = "They stay. They may grow, shrink or stay the same.[^mpfib] They often shrink after menopause.[^mpfib]"
risks = "Signs can get worse over time. Go back to your doctor if they do."
[options.table]
uterus = "Yes"
recovery = "None"
pregnancy = "Yes"
come_back = "They stay"

[[options]]
id = "non-hormone-medicines"
name = "Medicines without hormones"
heading = "Medicines without hormones"
what = "Pain pills, iron pills, and a pill called tranexamic acid. It helps blood clot so periods are lighter.[^mpfib][^txa]"
how = "Pain pills ease cramps. Iron builds back your blood.[^owh] Tranexamic acid is taken only on period days, up to 5 days each month.[^txa]"
good = "Heavy periods or cramps, if you want to skip hormones.[^mpfib]"
not_for = "Tranexamic acid is not for people who take birth control with estrogen, or who have had blood clots.[^txa]"
recovery = "None."
pregnancy = "Yes. These are not birth control."
come_back = "These treat the signs, not the fibroids. Signs come back if you stop."
risks = "Tranexamic acid can rarely cause blood clots.[^txa] Pain pills can upset your stomach."
[options.table]
uterus = "Yes"
recovery = "None"
pregnancy = "Yes"
come_back = "They stay"

[[options]]
id = "hormone-medicines"
name = "Hormone medicines"
heading = "Hormone medicines"
what = "Birth control pills or shots. Daily pills that lower hormones. Shots for up to 3 months before surgery, to stop bleeding and build back blood.[^mpfib][^lupron]"
how = "These change hormones so periods are lighter. Some shrink fibroids for a while.[^mpfib]"
good = "Heavy periods. With the daily hormone-lowering pills, about 7 in 10 bled much less. On a fake pill, 1 or 2 in 10 did.[^liberty]"
not_for = "People who have had blood clots or some other health problems.[^oriahnn][^myfembree]"
recovery = "None."
pregnancy = "Birth control pills and shots prevent it. The others are not birth control.[^oriahnn][^lupron]"
come_back = "Signs often return when you stop. Fibroids can regrow fast.[^owh]"
risks = "Hot flashes. Some weaken bones, so use is limited: up to 2 years for the daily pills, a few months for shots.[^oriahnn][^myfembree][^lupron]"
[options.table]
uterus = "Yes"
recovery = "None"
pregnancy = "Depends on the medicine"
come_back = "Often, after stopping"

[[options]]
id = "iud"
name = "Hormone IUD"
heading = "Hormone IUD"
what = "An IUD is a small T-shaped device placed in the uterus. This kind gives off a small amount of hormone.[^mpfib][^owh]"
how = "The hormone thins the lining of the uterus, so periods are lighter.[^owh]"
good = "Heavy periods, if you also want birth control. It can be used for this for up to 5 years.[^mirena]"
not_for = "Fibroids that change the shape of the inside of the uterus.[^mirena]"
recovery = "It is placed in a short office visit."
pregnancy = "Not while it is in. It is birth control. You can try once it is taken out.[^mirena]"
come_back = "It does not remove fibroids. It treats the bleeding."
risks = "Spotting at first. With fibroids, it is more likely to slip out.[^obg]"
[options.table]
uterus = "Yes"
recovery = "Same day"
pregnancy = "After removal"
come_back = "They stay"

[[options]]
id = "focused-ultrasound"
name = "Focused ultrasound"
heading = "Focused ultrasound"
what = "Sound waves heat and destroy fibroids. There is no cut. An MRI scanner, a large machine that takes pictures, guides it.[^rinfo]"
how = "Beams of sound meet at the fibroid and heat it. The fibroid gets smaller over time.[^rinfo]"
good = "Some fibroids that the beams can reach, in a uterus that is not too big.[^fdapma]"
not_for = "Pregnancy, many or very large fibroids, or many scars on the belly.[^rinfo]"
recovery = "Short. Most people go back to normal soon.[^rinfo]"
pregnancy = "Some people have had babies after it. Doctors are still studying this.[^rinfo]"
come_back = "Yes. Some people need more treatment if signs return.[^rinfo]"
risks = "Belly pain, skin burns or bruises that heal in a week or two.[^rinfo] Not all insurance plans pay for it.[^rinfo][^bcbsnc]"
[options.table]
uterus = "Yes"
recovery = "Short"
pregnancy = "Still being studied"
come_back = "Can"

[[options]]
id = "embolization"
name = "Fibroid embolization"
heading = "Fibroid embolization"
aka = "Also called UFE or uterine artery embolization. Embolization means blocking blood flow on purpose."
what = "No surgery, only a tiny skin nick.[^sir]"
how = "A thin tube goes in at the wrist or groin. Tiny beads block blood to the fibroids, so they shrink.[^sir][^mpfib]"
good = "Fibroids causing bleeding, pain or pressure, if you want to keep your uterus.[^acr]"
not_for = "Pregnancy, pelvic infection, or possible cancer.[^rinfo]"
recovery = "Most go home the same day,[^sir] back to normal in 7 to 10 days.[^mpuae]"
pregnancy = "Maybe. Pregnancies happen, but proof is weaker than after fibroid surgery. Experts disagree.[^mpuae][^cochrane][^acr]"
come_back = "About 1 in 3 needed more treatment within 5 years.[^rest]"
risks = "Cramps, upset stomach, low fever for 2 to 7 days.[^sir] 2 to 3 in 100 pass bits of fibroid. 1 to 5 in 100 reach menopause early, more often over 45. Some later need the uterus removed.[^rinfo]"
next = "Want to talk to a doctor who does this? [Find a doctor for fibroid embolization](/ufe/)."
[options.table]
uterus = "Yes"
recovery = "About 7 to 10 days"
pregnancy = "Maybe; experts disagree"
come_back = "About 1 in 3 need more care in 5 years"

[[options]]
id = "radiofrequency"
name = "Radiofrequency ablation"
heading = "Radiofrequency ablation"
what = "Heat from a small needle destroys the fibroid. Ablation means destroying tissue.[^mpfib]"
how = "The needle goes into the fibroid through small cuts in the belly, or through the vagina with no cuts. Ultrasound guides it.[^mpfib][^sonata3]"
good = "Some fibroids, if you want to keep your uterus.[^obg]"
not_for = "Ask your doctor. Not every fibroid can be reached this way."
recovery = "Most go home the same day.[^halt]"
pregnancy = "Maybe. There is not much proof yet.[^obg]"
come_back = "Studies differ. In one, about 1 in 11 needed surgery within 3 years.[^sonata3] In another, about 2 in 5 needed surgery within 2 years.[^dutch]"
risks = "Pain or cramps. Serious problems were rare in studies.[^sonata3][^dutch]"
[options.table]
uterus = "Yes"
recovery = "Home the same day"
pregnancy = "Not well studied"
come_back = "Can"

[[options]]
id = "hysteroscopic"
name = "Removal through the cervix"
heading = "Removal through the cervix"
aka = "Also called hysteroscopic myomectomy. A myomectomy is surgery that takes out the fibroids."
what = "A doctor removes fibroids from inside the uterus. There are no cuts.[^mpfib][^mphysteroscopy]"
how = "A thin camera goes in through the cervix, the opening at the bottom of the uterus. Small tools take out the fibroid.[^mphysteroscopy]"
good = "Fibroids that grow inside the uterus.[^mpfib]"
not_for = "Fibroids in the wall or on the outside. Pregnancy or a pelvic infection.[^mphysteroscopy]"
recovery = "A few days.[^ccmyo]"
pregnancy = "Yes. It can be a good choice if you want children.[^acr][^ccmyo]"
come_back = "New fibroids can grow later.[^owh]"
risks = "Cramps and light bleeding for a few days. Heavy bleeding, infection or a tear in the uterus are rare.[^mphysteroscopy]"
[options.table]
uterus = "Yes"
recovery = "A few days"
pregnancy = "Yes"
come_back = "New ones can grow"

[[options]]
id = "endometrial-ablation"
name = "Endometrial ablation"
heading = "Endometrial ablation"
what = "A procedure that destroys the lining of the uterus to make periods lighter. The lining is called the endometrium.[^mpea]"
how = "Tools go in through the vagina with no cuts. Heat or cold scars the lining.[^mpea]"
good = "Heavy bleeding with small fibroids. It often stops periods.[^mpfib] Experts disagree on using it for fibroids.[^acr]"
not_for = "Anyone who might want to get pregnant later.[^mpea][^fdaea]"
recovery = "Most go home the same day and are back to normal in 1 to 2 days.[^mpea]"
pregnancy = "No. Pregnancy after it can be dangerous. You still need birth control.[^fdaea][^mpea]"
come_back = "It does not remove fibroids. It treats the lining."
risks = "Cramps and discharge for a while. A hole in the uterus or infection are rare.[^mpea]"
[options.table]
uterus = "Yes"
recovery = "1 to 2 days"
pregnancy = "No"
come_back = "They stay"

[[options]]
id = "myomectomy"
name = "Myomectomy"
heading = "Myomectomy: surgery to remove fibroids"
what = "Surgery that takes out the fibroids and leaves the uterus.[^mpfib]"
how = "A surgeon cuts out each fibroid. This is done through a larger cut in the belly or a few small cuts.[^ccmyo]"
good = "Fibroids that cause problems, if you want children later.[^mpfib][^acr]"
not_for = "Ask your surgeon. It depends on how many fibroids you have and where they are."
recovery = "About 2 to 4 weeks with small cuts. Up to 6 weeks with a larger cut.[^ccmyo]"
pregnancy = "Yes. You may need a C-section.[^ccmyo] A tear in the uterus in pregnancy is rare: about 3 to 6 in 1,000.[^groffils][^gambacorti]"
come_back = "New fibroids can grow.[^mpfib] More likely if you are under 40 with many.[^ccmyo]"
risks = "Bleeding, infection, blood clots and harm to nearby organs. These are not common.[^ccmyo]"
[options.table]
uterus = "Yes"
recovery = "About 2 to 6 weeks"
pregnancy = "Yes"
come_back = "New ones can grow"

[[options]]
id = "hysterectomy"
name = "Hysterectomy"
heading = "Hysterectomy: surgery to remove the uterus"
what = "Surgery that takes out the whole uterus.[^mphyst]"
how = "The uterus comes out through the vagina, through small cuts, or through a larger cut in the belly.[^mphyst]"
good = "Bad signs, if you do not want children, or other choices have not worked.[^mpfib][^owh]"
not_for = "Anyone who wants to get pregnant later.[^ccmyo]"
recovery = "About 2 to 4 weeks with small cuts. About 4 to 6 weeks with a larger cut.[^mphyst]"
pregnancy = "No. Periods stop too.[^ccmyo]"
come_back = "No. It is the only treatment that makes sure fibroids cannot come back.[^owh]"
risks = "Bleeding, infection, blood clots and harm to nearby organs. If the ovaries, which make eggs and hormones, are also taken out, menopause starts.[^mphyst]"
[options.table]
uterus = "No"
recovery = "About 2 to 6 weeks"
pregnancy = "No"
come_back = "No"

