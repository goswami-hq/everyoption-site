title = "Fibroids: Every Treatment Option | Every Option"
description = "Fibroids are common, non-cancerous growths in the uterus. Learn how invasive each treatment is, how well it works, and its side effects."
h1 = "Shrink fibroids without surgery"
answer = "Fibroids are growths in the uterus. They are not cancer. Many women have no symptoms and need no treatment.[^mpfib] If you have heavy periods, pain, or pressure, embolization is not your only option. You can also consider medicines, other less invasive treatments, or surgery.[^mpfib] The right choice depends on your symptoms and goals."
urgent = "If you have severe bleeding, severe pain, a fever, or feel very sick or faint, call 911."
