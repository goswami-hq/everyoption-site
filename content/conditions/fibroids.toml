[[sections]]
id = "what"
place = "after"
heading = "What are fibroids?"
text = [
  "Fibroids are muscle growths in or on the wall of the uterus. They are very common. By age 50, about 2 to 8 out of 10 women have them.[^owh]",
  "Symptoms can include heavy or long periods, tiredness from blood loss, pelvic pain or pressure, frequent urination, and pain during sex.[^mpfib][^owh] See a doctor if you have any of these, or if you soak through a pad or tampon every hour for 2 to 3 hours.[^mpbleed]",
]

[[sections]]
id = "ask"
place = "after"
heading = "What should I ask my doctor?"
list = [
  "Which options could work for me, and which could not?",
  "How would each option affect a future pregnancy?",
  "How long would I need to recover?",
  "Do you offer embolization, or can you refer me to someone who does?",
]

[[faq]]
q = "Do I need treatment?"
a = "Not always. If you have no symptoms or only mild ones, your doctor can watch the fibroids with exams or an ultrasound. They often shrink after menopause.[^mpfib][^owh]"

[[faq]]
q = "Are fibroids cancer?"
a = "No. Rarely, a growth that looks like a fibroid turns out to be cancer. Estimates differ. Some say less than 1 out of 1,000 women.[^owh] Others say up to about 1 out of 225 women who have fibroid surgery.[^fdamorc]"

[[faq]]
q = "Can I get pregnant after treatment?"
a = "It depends on the treatment and your situation. If you hope to get pregnant, ask your doctor which options fit you before you choose. Pregnancy is not possible after a hysterectomy and can be dangerous after endometrial ablation.[^ccmyo][^fdaea]"

[[faq]]
q = "Do I need a hysterectomy for fibroids?"
a = "Not always. Many women never need one. It is the only treatment that keeps fibroids from returning. Medicines, less invasive treatments, and surgery that removes only the fibroids are also options.[^mpfib][^owh]"

[[options]]
id = "non-hormone-medicines"
name = "Medicines without hormones"
what = "These include tranexamic acid, which you take only on period days, plus pain relievers and iron.[^mpfib][^txa][^owh]"
invasive = "These are pills. No procedure is needed."
works = "They ease bleeding and cramps. They do not treat the fibroids, so symptoms return when you stop.[^mpfib][^txa]"
side = "Tranexamic acid can rarely cause blood clots.[^txa]"

[[options]]
id = "hormone-medicines"
name = "Hormone medicines"
what = "These include birth control pills or shots, daily pills that lower hormones, and short-term shots before surgery.[^mpfib][^lupron]"
invasive = "These are pills or shots. No procedure is needed."
works = "Daily hormone-lowering pills greatly reduced bleeding for about 7 out of 10 women.[^liberty] Symptoms often return after stopping.[^owh]"
side = "You may have hot flashes. Some of these medicines weaken bones, so use is limited. They are not for women who have had blood clots.[^oriahnn][^myfembree][^lupron]"

[[options]]
id = "iud"
name = "Hormone IUD"
what = "A small device placed in the uterus thins the lining. It lasts up to 5 years.[^owh][^mirena]"
invasive = "It is placed during an office visit."
works = "It lightens periods. It does not treat the fibroids.[^owh]"
side = "You may have spotting at first. It is more likely to slip out when fibroids are present.[^obg]"

[[options]]
id = "embolization"
name = "Fibroid embolization (UFE)"
what = "Tiny beads block blood flow to the fibroids so they shrink. You keep your uterus.[^sir][^mpfib][^mpuae]"
invasive = "You only need a tiny skin nick. There is no cut in the belly, so no belly scar where a hernia can form. Most women go home the same day.[^sir][^mpuae] Recovery takes about 1 week,[^sir][^mpuae] instead of 2 to 6 weeks after major surgery.[^ccmyo][^mphyst]"
works = "Most women feel much better. Almost 9 out of 10 women see their symptoms improve.[^iqwig] About 7 out of 10 women still feel better five years later.[^spies] Most women feel just as satisfied as those who had surgery.[^cochrane][^rest]\nSome women may need more treatment: about 1 out of 4 may need another procedure down the line.[^spies][^femme4][^rest]\nAfter ten years, about 2 out of 3 women avoided a hysterectomy entirely.[^emmy]"
side = "You may have cramps, nausea, and a low fever for up to a week. Up to 5 out of 100 women may go through menopause early.[^sir][^rinfo] Serious problems are no more common than after surgery. Smaller problems are more common.[^cochrane][^martin]"

[[options]]
id = "radiofrequency"
name = "Radiofrequency ablation"
what = "Heat from a small needle destroys the fibroid.[^mpfib]"
invasive = "The doctor uses small cuts in the belly, or goes through the vagina with no cuts. Most women go home the same day.[^sonata3][^halt]"
works = "Results vary from study to study. About 1 out of 11 women needed surgery within 3 years in one study, and about 2 out of 5 within 2 years in another.[^sonata3][^dutch]"
side = "You may have pain and cramps. Serious problems were rare in studies.[^sonata3][^dutch]"

[[options]]
id = "focused-ultrasound"
name = "Focused ultrasound"
what = "Sound waves, guided by an MRI scanner, heat and shrink the fibroid.[^rinfo]"
invasive = "There is no cut. Most women recover quickly.[^rinfo]"
works = "It fits only some fibroids. Some women need more treatment later. Not all insurance covers it.[^rinfo][^fdapma][^bcbsnc]"
side = "You may have belly pain. Skin burns or bruises can happen and usually heal in a week or two.[^rinfo]"

[[options]]
id = "endometrial-ablation"
name = "Endometrial ablation"
what = "Heat or cold destroys the lining of the uterus to lighten periods.[^mpea]"
invasive = "There are no cuts. Most women go home the same day and recover in 1 to 2 days.[^mpea]"
works = "It treats the lining, not the fibroids, so they stay in place.[^mpfib] A radiology group rates it usually not appropriate for fibroids.[^acr] In studies of heavy bleeding, about 1 out of 8 women had a hysterectomy within 5 years.[^oderkerk]"
side = "You may have cramps and discharge for a while. It is not for anyone who may want a future pregnancy.[^mpea][^fdaea]"

[[options]]
id = "hysteroscopic"
name = "Removal through the cervix"
what = "A thin camera and small tools remove fibroids growing inside the uterus.[^mpfib][^mphysteroscopy]"
invasive = "There are no cuts. Recovery takes a few days.[^ccmyo]"
works = "It only works for fibroids inside the uterus. New fibroids can form later.[^mpfib][^owh]"
side = "You may have cramps and light bleeding for a few days. Heavy bleeding, infection, or a tear in the uterus are rare.[^mphysteroscopy]"

[[options]]
id = "myomectomy"
name = "Myomectomy"
what = "Surgery removes the fibroids and leaves the uterus.[^mpfib]"
invasive = "It takes a larger cut in the belly or a few small cuts. Recovery takes about 2 to 6 weeks.[^ccmyo]"
works = "It removes the fibroids you have, but new ones can grow.[^mpfib][^ccmyo] Women's quality of life improves.[^femme2] About 1 out of 8 women may need another procedure down the line.[^femme4]"
side = "Bleeding, infection, blood clots, and harm to nearby organs can happen but are not common.[^ccmyo] Scar tissue forms inside the belly in most women. It can make organs stick together. It often causes no symptoms, but it can cause pain or block the bowel.[^asrm][^ccadh] After open surgery, up to 1 out of 5 people get a hernia at the scar.[^cchernia]"

[[options]]
id = "hysterectomy"
name = "Hysterectomy"
what = "Surgery removes the whole uterus.[^mphyst]"
invasive = "The doctor goes through the vagina, small cuts, or a larger cut in the belly. Recovery takes about 2 to 6 weeks.[^mphyst]"
works = "It is the only treatment that keeps fibroids from returning. Periods stop.[^owh][^ccmyo]"
side = "Bleeding, infection, blood clots, and harm to nearby organs can happen. Menopause begins if the ovaries are also removed.[^mphyst] Scar tissue can make organs stick together and, rarely, block the bowel.[^asrm][^ccadh] After open surgery, up to 1 out of 5 people get a hernia at the scar.[^cchernia]"

