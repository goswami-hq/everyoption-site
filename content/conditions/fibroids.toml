title = "Fibroids: every treatment option | Every Option"
description = "Fibroids are common, non-cancerous growths in the uterus. Learn about every treatment option: medicines, non-surgical procedures, embolization and surgery."
h1 = "What are my options for fibroids?"
answer = "Fibroids are non-cancerous growths in the uterus. Many cause no symptoms and need no treatment.[^mpfib] When they cause heavy periods, pain or pressure, the options fall into four groups: medicines, non-surgical procedures, interventional radiology and surgery.[^mpfib] The right choice depends on your symptoms and your goals."
finder_button = "Find a doctor for fibroid embolization"
options_heading = "Your options"
faq_heading = "Common questions"
not_advice = "Education, not medical advice. Talk to your doctor about your own care."
find_heading = "Find a doctor"
find_text = [
  "A gynecologist can discuss medicines and surgery. An interventional radiologist performs fibroid embolization, using imaging to guide treatment through tiny tubes.[^sir] Our free finder lists doctors near you. It is not a ranking.",
]

terms = ["fibroids", "fibroid", "uterus", "uterine", "menopause", "ultrasound", "tranexamic acid", "hormones", "hormone", "IUD", "MRI", "embolization", "radiofrequency", "ablation", "cervix", "hysteroscopic", "endometrial", "myomectomy", "hysterectomy", "gynecologist", "interventional radiology", "interventional radiologist", "ovaries"]

[[categories]]
id = "medicines"
name = "Medicines"
summary = "Treat symptoms such as heavy bleeding and pain. No procedure, and usually the first thing to try."
options = ["non-hormone-medicines", "hormone-medicines", "iud"]

[[categories]]
id = "non-surgical"
name = "Non-surgical procedures"
summary = "Treat fibroids or heavy bleeding without major surgery. Each one fits only certain people."
options = ["focused-ultrasound", "radiofrequency", "endometrial-ablation"]

[[categories]]
id = "ir"
name = "Interventional radiology"
summary = "Shrinks fibroids by blocking their blood supply, through a tiny skin nick. The uterus stays in place."
options = ["embolization"]

[[categories]]
id = "surgery"
name = "Surgery"
summary = "Removes the fibroids or the whole uterus. Hysterectomy is the only option that keeps fibroids from returning."
options = ["hysteroscopic", "myomectomy", "hysterectomy"]

[[sections]]
id = "treat"
heading = "Do I need treatment?"
text = ["Not always. Fibroids that cause no symptoms or only mild ones can simply be watched with exams or an ultrasound.[^mpfib][^owh] They may grow, shrink or stay the same, and they often shrink after menopause.[^mpfib] See your doctor if symptoms get worse."]

[[options]]
id = "non-hormone-medicines"
name = "Medicines without hormones"
heading = "Medicines without hormones"
text = [
  "Tranexamic acid is taken only on period days, up to 5 days a month, and helps blood clot so periods are lighter.[^mpfib][^txa] Pain relievers ease cramps, and iron rebuilds your blood count after heavy bleeding.[^owh]",
  "These treat symptoms rather than the fibroids, so symptoms return when you stop. Tranexamic acid is not for people who take birth control with estrogen or who have had blood clots, and it can rarely cause clots.[^txa] You can still become pregnant while using these.",
]

[[options]]
id = "hormone-medicines"
name = "Hormone medicines"
heading = "Hormone medicines"
text = [
  "Birth control pills or shots can lighten periods, and daily pills that lower hormone levels help too. In studies of those daily pills, about 7 in 10 people bled much less, compared with 1 or 2 in 10 on a placebo.[^mpfib][^liberty] Other shots, given for up to 3 months before surgery, can stop bleeding and shrink fibroids for a while.[^mpfib][^lupron]",
  "Symptoms often return after stopping, and fibroids can regrow quickly.[^owh] Hot flashes are common. Some of these medicines weaken bones, so use is limited to about 2 years for the daily pills and a few months for the shots.[^oriahnn][^myfembree][^lupron] They are not for people who have had blood clots or certain other health problems.[^oriahnn][^myfembree] Only birth control pills and shots prevent pregnancy.[^oriahnn][^lupron]",
]

[[options]]
id = "iud"
name = "Hormone IUD"
heading = "Hormone IUD"
text = [
  "A small T-shaped device placed in the uterus during an office visit. It releases a small amount of hormone that thins the uterine lining, so periods are lighter, for up to 5 years.[^mpfib][^owh][^mirena]",
  "It treats the bleeding, not the fibroids. It also works as birth control, and you can try to conceive once it is removed.[^mirena] It is not for fibroids that change the shape of the inside of the uterus,[^mirena] and it is more likely to slip out when fibroids are present.[^obg]",
]

[[options]]
id = "focused-ultrasound"
name = "Focused ultrasound"
heading = "Focused ultrasound"
text = [
  "Beams of sound meet at the fibroid and heat it, so it shrinks over time. An MRI scanner guides the treatment and there is no incision, and most people recover quickly.[^rinfo]",
  "It suits some fibroids the beams can reach, in a uterus that is not too large.[^fdapma] It is not for pregnancy, many or very large fibroids, or many scars on the belly. Some people need more treatment later, pregnancy afterward is still being studied, and not all insurance plans cover it.[^rinfo][^bcbsnc] Belly pain and skin burns or bruises can occur and usually heal within a week or two.[^rinfo]",
]

[[options]]
id = "radiofrequency"
name = "Radiofrequency ablation"
heading = "Radiofrequency ablation"
text = [
  "Heat from a small needle destroys the fibroid. Ultrasound guides the needle, which goes in through small cuts in the belly or through the vagina with no cuts.[^mpfib][^sonata3] Most people go home the same day.[^halt]",
  "It suits some fibroids if you want to keep your uterus, though pregnancy afterward has not been well studied.[^obg] Repeat treatment varies by study: about 1 in 11 needed surgery within 3 years in one, and about 2 in 5 within 2 years in another.[^sonata3][^dutch] Pain and cramps are common, and serious problems were rare in studies.[^sonata3][^dutch]",
]

[[options]]
id = "endometrial-ablation"
name = "Endometrial ablation"
heading = "Endometrial ablation"
text = [
  "Heat or cold destroys the lining of the uterus to lighten periods, using tools passed through the vagina.[^mpea] Most people go home the same day and recover in 1 to 2 days.[^mpea]",
  "It treats the lining, not the fibroids, which stay in place, and experts disagree on using it for fibroids.[^mpfib][^acr] It is not for anyone who might want a future pregnancy. Pregnancy afterward can be dangerous, so you still need birth control.[^fdaea][^mpea]",
]

[[options]]
id = "embolization"
name = "Fibroid embolization"
heading = "Fibroid embolization (UFE)"
text = [
  "Also called uterine artery embolization. A doctor passes a thin tube through a tiny nick at the wrist or groin, then releases tiny beads that block blood flow to the fibroids so they shrink.[^sir][^mpfib] Most people go home the same day and are back to normal in 7 to 10 days.[^sir][^mpuae]",
  "It suits fibroids causing bleeding, pain or pressure if you want to keep your uterus.[^acr] It is not for pregnancy, pelvic infection or possible cancer.[^rinfo] Pregnancies do happen afterward, but the evidence is weaker than after fibroid surgery and experts disagree.[^mpuae][^cochrane][^acr]",
  "Cramps, nausea and low fever are common for 2 to 7 days.[^sir] About 2 to 3 in 100 pass pieces of fibroid, and 1 to 5 in 100 reach menopause early, more often over age 45. Some later need a hysterectomy.[^rinfo] About 1 in 3 needed more treatment within 5 years.[^rest]",
]

[[options]]
id = "hysteroscopic"
name = "Removal through the cervix"
heading = "Removal through the cervix (hysteroscopic myomectomy)"
text = [
  "A thin camera passes through the cervix, and small tools remove fibroids from inside the uterus with no cuts.[^mpfib][^mphysteroscopy] Recovery takes a few days, and it can be a good choice if you want children.[^acr][^ccmyo]",
  "It works only for fibroids growing inside the uterus, and new fibroids can form later.[^mpfib][^owh] Cramps and light bleeding are common for a few days. Heavy bleeding, infection or a tear in the uterus are rare.[^mphysteroscopy]",
]

[[options]]
id = "myomectomy"
name = "Myomectomy"
heading = "Myomectomy"
text = [
  "Surgery that removes the fibroids and leaves the uterus, through a larger cut in the belly or a few small cuts.[^mpfib][^ccmyo] Recovery takes about 2 to 4 weeks with small cuts and up to 6 weeks with a larger one.[^ccmyo]",
  "It suits fibroids causing problems if you want children later.[^mpfib][^acr] You may need a C-section, and a tear in the uterus during pregnancy is rare, about 3 to 6 in 1,000.[^ccmyo][^groffils][^gambacorti] New fibroids can grow, more often in people under 40 with many fibroids.[^mpfib][^ccmyo] Risks include bleeding, infection, blood clots and harm to nearby organs, which are not common.[^ccmyo]",
]

[[options]]
id = "hysterectomy"
name = "Hysterectomy"
heading = "Hysterectomy"
text = [
  "Surgery that removes the whole uterus, through the vagina, small cuts or a larger cut in the belly. Recovery takes about 2 to 4 weeks with small cuts and 4 to 6 weeks with a larger one.[^mphyst]",
  "It is the only treatment that keeps fibroids from returning.[^owh] It suits severe symptoms when you do not want children or other options have not worked.[^mpfib][^owh] Periods stop and pregnancy is no longer possible.[^ccmyo] Risks include bleeding, infection, blood clots and harm to nearby organs. If the ovaries are also removed, menopause begins.[^mphyst]",
]

[[sections]]
id = "what"
place = "after"
heading = "What are fibroids?"
text = [
  "Fibroids are muscle growths in or on the wall of the uterus.[^owh] They are very common: by age 50, between 2 and 8 in 10 women have them.[^owh] In one large study, more than 8 in 10 Black women and about 7 in 10 white women had them by 50.[^baird]",
  "Symptoms can include heavy or long periods, bleeding between periods, tiredness from blood loss, pelvic pain or pressure, frequent urination, constipation and pain during sex.[^mpfib][^owh] See a doctor if you have any of these, or if you soak through a pad or tampon every hour for 2 to 3 hours.[^mpbleed]",
]

[[sections]]
id = "urgent"
kind = "urgent"
place = "after"
heading = "When should I get help right away?"
text = ["**If you have severe bleeding, severe pain, a fever, or feel very sick or faint, call 911.**"]

[[sections]]
id = "choose"
place = "after"
heading = "How do I choose?"
text = ["There is no single best option.[^owh][^mpfib] It depends on how much your symptoms affect you, whether you may want a pregnancy, the size and location of your fibroids, how close you are to menopause, and what matters most to you. It is fine to ask about every option here and to see more than one kind of doctor."]

[[sections]]
id = "ask"
place = "after"
heading = "What should I ask my doctor?"
list = [
  "Where are my fibroids, and how big are they?",
  "Which options could work for me, and which could not?",
  "How would each option affect a future pregnancy?",
  "How long would I need to recover, and how likely is it to come back?",
  "Do you offer embolization, or can you refer me to someone who does?",
]

[[faq]]
q = "Are fibroids cancer?"
a = "No. Rarely, a growth that looks like a fibroid is a hidden cancer. Estimates differ: less than 1 in 1,000,[^owh] or about 1 in 225 to 1 in 580 people who have fibroid surgery.[^fdamorc]"

[[faq]]
q = "Do fibroids go away on their own?"
a = "Sometimes. Many do not grow or need treatment, and they often shrink after menopause.[^mpfib][^owh]"

[[faq]]
q = "Can I get pregnant if I have fibroids?"
a = "Most people can. Large fibroids can sometimes cause problems in pregnancy, so tell your doctor if you want a baby later.[^ccfib]"

[[faq]]
q = "Do I need a hysterectomy for fibroids?"
a = "Not always. Many people never need one. Medicines, procedures that keep the uterus and surgery that removes only the fibroids are all options.[^mpfib][^owh]"

[[faq]]
q = "What is the least invasive treatment for fibroids?"
a = "Watching and medicines involve no procedure. Focused ultrasound, embolization, removal through the cervix and one kind of radiofrequency ablation need no cuts or only a tiny nick. Each fits some people and not others.[^mpfib][^rinfo][^sir]"


