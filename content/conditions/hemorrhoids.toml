[[sections]]
id = "what"
place = "box"
heading = "What are hemorrhoids?"
text = [
  "Hemorrhoids are swollen veins inside the lower rectum (the last part of the bowel) or under the skin around the anus.[^niddk] Hemorrhoids that are inside the rectum can bleed or bulge out and are usually painless. Outside ones can itch, ache, or form a tender lump.[^niddk]",
]
symptoms_label = "Common symptoms"
symptoms = ["Bright red blood on the toilet paper", "A lump that bulges out", "Itching", "Aching or a tender lump"]
symptoms_cite = "[^niddk]"
see_doctor_heading = "When to see a doctor"
see_doctor = "Rectal bleeding needs a check with a doctor first. Bleeding can come from other problems, such as colon cancer or bowel inflammation, so see a doctor about any bleeding.[^niddk] Sudden, severe pain can mean a blood clot in a hemorrhoid or a small tear (fissure), and needs a doctor soon.[^aga]"

[[sections]]
id = "after-banding"
place = "lead"
heading = "If bleeding keeps coming back after banding"
text = [
  "You have three paths. Banding is a good choice for many people.[^aga] Embolization needs no surgery, and early studies suggest it hurts much less than surgery in the first days.[^falsarella] However, bleeding may come back for some people.[^degregorio] Surgery is the most lasting fix, but also the most painful to recover from.[^jin21][^vanoost]",
  "If your hemorrhoids bulge out and stay bulging out, surgery is usually needed.[^aga] Embolization is mainly a treatment for bleeding.[^kucukay][^siccr] Studies comparing it with banding are under way.[^brussel][^stratos] Every Option's physician performs embolization.",
]

[[sections]]
id = "right-for-me"
place = "after"
heading = "Is embolization right for me?"
text = [
  "If bleeding keeps coming back after fiber and office treatments and you do not want surgery, it may suit you.[^siccr] Early studies suggest some people also have less aching afterward.[^nguyenhuy][^falsarella]",
  "It is usually not the right choice if your hemorrhoids bulge out and stay out, or if your main problem is sudden, severe pain from a clot or a tear. It has not been studied in pregnancy.[^aga][^brussel]",
]

[[sections]]
id = "serious"
place = "after"
heading = "Serious problems after any hemorrhoid treatment"
text = [
  "A serious infection in the pelvis is very rare after any hemorrhoid treatment. Get care right away if you have a fever, severe pain, or feel very sick after a procedure.[^aga]",
]

[[sections]]
id = "ask"
place = "after"
heading = "What should I ask my doctor?"
list = [
  "Have you checked my colon? What is causing the bleeding?",
  "Do my hemorrhoids bulge out? Do they go back in?",
  "Could banding or another office treatment work for me?",
  "If I choose embolization, how often does bleeding come back? What happens if it does?",
  "What is the plan if a problem happens after the procedure?",
]

[[faq]]
q = "Does insurance cover hemorrhoid embolization?"
a = "Coverage varies by plan. Some insurers cover it under set conditions, some list it as unproven or not covered, and Medicare decides case by case.[^cigna][^uhc][^aetna][^ncd] Ask your plan before you book. [See what each insurer's policy says](/insurance/#hae)."

[[faq]]
q = "Which doctor treats hemorrhoids?"
a = "Family doctors, gastroenterologists (digestive specialists), and colorectal surgeons check and treat hemorrhoids, and many do banding in the office. Interventional radiologists perform embolization. Ask your doctor for a referral, or contact one of the doctors listed on our site."   # his words 2026-11-10 15:03 CT: "Just leave it"

[[faq]]
q = "Will hemorrhoids go away on their own?"
a = "Sometimes. Some people with an early flare have no more flares for years, but for many the symptoms come back.[^jensen]"

[[faq]]
q = "What if I am pregnant?"
a = "Hemorrhoids are common in pregnancy. Treatment is usually fiber, treating constipation, and creams. Office treatments can be considered after the birth if symptoms last.[^aga]"

[[options]]
id = "fiber"
name = "Fiber and home care"
what = "This means more fiber from food or a daily fiber supplement and not straining or sitting a long time on the toilet.[^aga]"
invasive = "No procedure is needed."
works = "Good evidence suggests fiber eases symptoms and lowers the chance of bleeding.[^alonso] It may not help much with bulging, pain, or itching.[^alonso]"
side = "Side effects are mild.[^alonso]"

[[options]]
id = "creams"
name = "Creams and warm baths"
what = "Creams, wipes, and sitz baths (sitting in warm water) are often used to soothe itching and aching. They treat symptoms, not the hemorrhoid itself.[^aga]"
invasive = "No procedure is needed."
# his line, his clinical judgment (vault/decisions.md 2026-11-10: "This is my clinical judgment. Sure with your change")
works = "Many people find they ease symptoms for a while, but there is little proof they help in the long run.[^aga]"
side = "Steroid creams should not be used for more than 2 weeks at a time.[^aga]"

[[options]]
id = "flavonoid"
name = "Flavonoid pills"
what = "Flavonoids are plant compounds taken as daily pills. Like creams, they ease symptoms rather than remove the hemorrhoid.[^alonsoflav][^perera]"
invasive = "No procedure is needed."
works = "Early studies suggest they ease bleeding and itching. Large reviews disagree on whether they ease pain.[^alonsoflav][^perera]"
side = "Few safety problems were found in the trials.[^perera] If you are pregnant, ask your doctor first: a related pill has not been shown safe in pregnancy.[^quijano]"

[[options]]
id = "embolization"
name = "Hemorrhoid artery embolization (HAE)"
lead_heading = "What is hemorrhoid artery embolization (HAE)?"
what = "Hemorrhoid artery embolization (HAE) treats bleeding hemorrhoids without surgery. A thin tube goes through a tiny skin nick in the wrist or groin. Tiny coils or beads block the arteries feeding the hemorrhoids, so they bleed less. Most people go home the same day.[^bagla][^falsarella][^kucukay]"
invasive = "Early studies suggest recovery is far less painful than after surgery in the first days.[^falsarella]"
invasive_heading = "Recovery"   # his word "Fine", 2026-11-10 15:03 CT; the text under it is about recovery
works = "Early results are encouraging. Most patients bleed less afterwards. About 2 out of 3 people still have little or no bleeding a year later. Some may need a second treatment or surgery.[^nguyenhuy][^degregorio][^tradi][^aljnainati] It is not known to fix hemorrhoids that bulge out.[^kucukay] It may spare you surgery, but we don't know that yet."
side = "You may experience increased pressure, an urge to go, or a low fever for a few days.[^han][^zhou] Serious bowel injury is possible, but rare.[^deoliveira][^eberspacher][^hess]"

[[options]]
id = "banding"
name = "Banding"
what = "A doctor places a tiny rubber band around the base of a hemorrhoid inside the rectum. It cuts off the blood supply, so the hemorrhoid shrinks and falls off.[^niddk]"
invasive = "It is done in the office, with no cut. Many people are back at work the next day.[^aga][^vanoost]"
works = "Good evidence suggests banding works well for many people. Hemorrhoids come back more often than after surgery. Some people need more than one session.[^vanoost][^johanson92]"
side = "You may have a dull ache or pressure for a few days and some bleeding.[^ding][^vanoost]"

[[options]]
id = "infrared"
name = "Infrared treatment"
what = "A small probe uses heat from infrared light to scar the hemorrhoid so it shrinks.[^niddk]"
invasive = "It is done in the office, with no cut.[^aga]"
works = "It helps about as much as banding at first. Studies disagree on whether it lasts as long.[^aga][^ding][^johanson92]"
side = "It hurts less than banding afterward. Bleeding afterward is about the same.[^ding]"   # C4 correction 2026-11-10: the "more bleeding" result was for coagulation methods as a group, not infrared

[[options]]
id = "injection"
name = "Injection (sclerotherapy)"
what = "A doctor injects a medicine into the hemorrhoid so it scars and shrinks.[^gallo]"
invasive = "It is done in the office, with no cut.[^gallo]"
works = "Early studies suggest it works about as well as other treatments it was compared with.[^gallo]"
side = "Problems afterward are less common than after other treatments.[^gallo]"

[[options]]
id = "ligation"
name = "Artery tying (ligation)"
what = "A surgeon uses an ultrasound probe inside the anus to find the arteries that feed the hemorrhoids, then ties them off with stitches. Nothing is cut out.[^brown16]"
invasive = "This is surgery, with no cut in the skin. Recovery is faster than after standard surgery.[^jee]"
works = "Early studies suggest it helps, but hemorrhoids come back more often than after standard surgery.[^jee] It may last longer than banding.[^brown16]"
side = "It hurts more than banding in the first week.[^brown16]"

[[options]]
id = "stapled"
name = "Stapled surgery"
what = "A surgeon uses a stapling tool to lift the hemorrhoids back into place.[^lauricella]"
invasive = "This is surgery."
works = "Good evidence suggests symptoms, mostly bulging, come back more often than after standard surgery.[^lauricella]"
side = "Over the long run, pain and bowel control are about the same as after standard surgery.[^lauricella]"

[[options]]
id = "laser"
name = "Laser surgery"
what = "A surgeon shrinks the hemorrhoids with heat from a laser.[^pompeu]"
invasive = "This is surgery. People got back to daily life sooner than after standard surgery.[^pompeu]"
works = "Early studies suggest it hurts less than standard surgery. How long it lasts is not yet known.[^pompeu]"
side = "Bleeding and trouble peeing afterward seem less common than after standard surgery.[^pompeu]"

[[options]]
id = "hemorrhoidectomy"
name = "Hemorrhoid removal (hemorrhoidectomy)"
what = "A surgeon cuts out the hemorrhoids.[^jin21]"
invasive = "This is surgery. The first week or more is painful, and many people need more than a week off work.[^vanoost][^jin21]"
works = "Good evidence suggests it is the most lasting fix. Hemorrhoids come back less often than after banding or other procedures.[^jin21][^vanoost]"
side = "Pain, bleeding, and trouble peeing afterward are more common than after office treatments.[^jin21] Longer-lasting trouble holding stool is uncommon, about 2 or 3 out of 100.[^jin25]"

