hero_intro = "Rectal bleeding always needs a doctor's check first, because it is not always hemorrhoids. Sometimes the doctor needs to check your colon.\nHemorrhoids have multiple treatments available. Fiber eases symptoms for many people. Office treatments such as banding also work well. If bleeding keeps coming back, you can look into embolization, which needs no surgery. Surgery is the most lasting fix."
