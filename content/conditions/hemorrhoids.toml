answer = "Hemorrhoids are swollen veins in and around the bottom. They are common.[^niddk] Fiber eases symptoms for many people, and office treatments like banding work well for many.[^aga][^alonso] If bleeding keeps coming back after those, embolization is one option that needs no surgery. Surgery is the most lasting fix.[^jin21][^vanoost] The right choice depends on your symptoms and goals."
urgent = "If you have heavy bleeding that does not stop, feel faint or dizzy, or have a high fever or severe pain after a procedure, get emergency care or call 911."
