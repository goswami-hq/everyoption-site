# ops/approvals/done/2026-11-22-fibroid-hysterectomy-short.md (approved post); added by scripts/videos_sync.py (ai-hq), CLAUDE.md "Approved films onto the site"
[[video]]
key = "hysterectomy-short"
title = "Do I need a hysterectomy for fibroids?"
description = "Do I need a hysterectomy for fibroids? Not always. Many women never need one.\nHysterectomy, surgery to remove the uterus, is the only treatment that keeps fibroids from returning. Medicines, less invasive treatments, and surgery that removes only the fibroids (myomectomy) are also options. Uterine fibroid embolization (UFE), also called uterine artery embolization, treats fibroids without surgery and without removing the uterus. Recovery usually takes about a week, compared with 2 to 6 weeks after major surgery, and most people go home the same day. Almost 9 out of 10 women see their symptoms improve; about 1 out of 4 may need another procedure down the line. Interventional radiologists, a type of doctor, perform it. UFE is for women with symptoms from fibroids (such as heavy periods, pelvic pain, cramps). Your doctor will check whether it fits you. If you hope to get pregnant, ask your doctor which options fit you."
credit = "Music and sound generated with AI (Stable Audio)"
condition = "fibroids"
order = 2
youtube_id = "PvxPSJcBWtg"
upload_date = "2026-11-27"
seconds = 33
aspect = "9:16"
still = "video-hysterectomy-short"
still_alt = "A frame from the film with the words: Do I need a hysterectomy for fibroids?"
