[[video]]
key = "fibroid-loop"
title = "What is uterine fibroid embolization (UFE)? Fibroid treatment without surgery"
description = "Heavy periods and pelvic pain ruining your day? It could be fibroids, non-cancerous growths in the uterus.\nMultiple treatments exist, including medicines and surgeries. Uterine fibroid embolization (UFE), also called uterine artery embolization, treats fibroids without surgery and without removing your uterus. Tiny beads block blood flow to the fibroids and help with fibroid symptoms. Recovery usually takes about a week, compared with 2 to 6 weeks after major surgery, and most people go home the same day. Almost 9 out of 10 women see their symptoms improve. Only about 1 in 4 may need another procedure down the line. UFE is performed by an interventional radiologist, a type of doctor."
credit = "Music and sound generated with AI (Stable Audio)"
