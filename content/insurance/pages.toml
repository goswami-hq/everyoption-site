[says_no]
intro = "This is general information. Your doctor's office and your plan can tell you what applies to you. Your denial letter lists your own deadlines."

[[says_no.steps]]
heading = "Prior authorization: approval before the procedure"
text = "Some plans want to approve a procedure before you have it. This is called prior authorization or preauthorization. An approval is not a promise that the plan will pay.{ref:glossary}"

[[says_no.steps]]
heading = "Appeal: ask your plan to look again"
text = "If your plan says no, you can ask it for a full review of its decision. This is called an internal appeal.{ref:appeals} For most plans, you have 180 days from the denial notice to file, and for a procedure you have not had yet, the plan must decide within 30 days.{ref:internal} Some older plans follow different rules.{ref:cfr147}"

[[says_no.steps]]
heading = "Peer-to-peer call: your doctor talks with the insurer"
text = "Your doctor may be able to talk with a reviewer at your insurer about why you need the procedure. This is called a peer-to-peer call, and it can be used to seek approval or to appeal a denial.{ref:ama} Ask your doctor's office whether it can request one."

[[says_no.steps]]
heading = "External review: an independent decision"
text = "If your appeal fails, you can ask an independent reviewer to decide. External review covers denials that involve medical judgment, and denials that call a treatment experimental or investigational. You must ask in writing within 4 months of the final denial. Your insurer has to accept the decision. It costs nothing or at most $25, depending on the process your insurer uses.{ref:external} In urgent cases, you can ask before your appeal is finished.{ref:internal} Employer plans that pay their own claims may use a state process or a federal one.{ref:cfr147}"

[[says_no.steps]]
heading = "If you have Original Medicare"
text = "Before a service, your doctor's office may give you an Advance Beneficiary Notice. It tells you that Medicare may not pay. You choose one of three options, and the office cannot choose for you. If you have the service and ask the office to bill Medicare, you accept the cost if Medicare does not pay, and you keep your right to appeal. The other two options end with no claim and no appeal.{ref:abn} Your Medicare Summary Notice gives the date to file an appeal, which is called a redetermination.{ref:mediorig}"

[[says_no.steps]]
heading = "If you have a Medicare Advantage plan"
text = "These plans must cover what Original Medicare covers and follow Medicare's coverage decisions. Where Medicare's rules are not fully set, a plan can write its own public rules.{ref:cfr422} To appeal, follow the directions in your denial notice within 65 days of its date. Your doctor can ask for you if you have not had the procedure yet.{ref:mediplan}"

[[says_no.steps]]
heading = "A clinical trial"
text = "Some insurers cover a procedure inside an approved study; see the insurer cards above. Medicare covers the routine costs of qualifying trials. The item being studied is not a routine cost, but Medicare can separately cover a device in an approved device study.{ref:trials} Ask the study team what you would pay. You can search for studies at <a href=\"https://clinicaltrials.gov\">ClinicalTrials.gov</a>."

[[says_no.steps]]
heading = "Paying yourself"
text = "If you do not use insurance, you can ask for a written good faith estimate of the cost. The office must give you one if you ask, or if you schedule at least 3 business days ahead. If your bill is at least $400 above that estimate, you may be able to dispute it. You must start within 120 days of the date on the original bill.{ref:gfe}"

[[asks]]
text = "Does my plan cover this procedure, and under what conditions?"
[[asks]]
text = "Which written policy applies to my plan?"
[[asks]]
text = "Do I need approval first (prior authorization)?"
[[asks]]
text = "What will I pay out of pocket?"

