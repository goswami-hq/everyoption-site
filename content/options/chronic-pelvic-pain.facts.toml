option = ""
simple = ""
deep = "Two vein problems can cause this pain, and they often happen together. Veins near the ovaries and uterus can widen and let blood flow the wrong way, sometimes called pelvic congestion syndrome. A large vein in the pelvis can also be squeezed by an artery next to it, which is often called May-Thurner syndrome. Each problem has its own treatment. Both are done through a tiny skin nick, without surgery, and nothing is cut out of your body. Some women need one treatment, and some need both"
