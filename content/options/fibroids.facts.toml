# The tie between the simple page (content/conditions/fibroids.toml) and the deep page (content/options/fibroids.toml).
# His words, 2026-11-05: "not to sync the simple and deep sources so they are exact, but rather have them be tied
# together in the numbers and sources and relative phrasings". The two pages keep their own text. Each entry names one
# number or comparison: `simple` must appear in that option's simple text with `refs` cited there; the deep page may
# state it only as {f:id}, which prints `deep` and its references. A new number on either page fails the build until it
# is entered here. option = "" means any part of the simple page.
