# ---- Deep page only (job platform-main-0027; sources: ai-hq projects/platform/content/pages/sources/fibroids-evidence-2026-11-07/) ----
[[fact]]
id = "gnrh-6mo"
option = "hormone-medicines"
simple = ""
deep = "over 6 months, from four large placebo-controlled trials of two medicines (relugolix and elagolix)"
refs = ["liberty", "schlaff"]
read = "abstract"
[[fact]]
id = "gnrh-placebo"
option = "hormone-medicines"
simple = ""
deep = "in those four trials, about 1 to 2 out of 10 women on the dummy pill met the same bleeding goal (8.7% to 19%)"
refs = ["liberty", "schlaff"]
read = "abstract"
[[fact]]
id = "ufe-range"
option = "embolization"
simple = ""
deep = "A German health-information institute puts symptom improvement at about 80 to 90 out of 100 women; the short guide's almost 9 out of 10 is the top of that range"
refs = ["iqwig"]
read = "page"
[[fact]]
id = "ufe-sat"
option = "embolization"
simple = ""
deep = "a Cochrane review of 7 randomized trials (793 women) found no clear difference up to 2 years (6 trials, 640 women; odds ratio 0.94, 95% CI 0.59 to 1.48; moderate certainty) or at 5 years (0.90, 0.45 to 1.80)"
refs = ["cochrane"]
read = "full text"
[[fact]]
id = "femme-qol"
option = "embolization"
simple = ""
deep = "in the FEMME trial (254 women, 29 UK hospitals), fibroid quality-of-life scores at 2 years were 84.6 after myomectomy and 80.0 after embolization, out of 100 (adjusted difference 8.0 points, 95% CI 1.8 to 14.1); at 4 years the gap was 5.0 points and no longer clear (95% CI -1.4 to 11.5)"
refs = ["femme2", "femme4"]
read = "abstract"
[[fact]]
id = "myo-time"
option = "myomectomy"
simple = ""
deep = "about 1 in 8 at 4 to 5 years (13% at 4 years in FEMME; 12.2% at 5 years pooled across studies), and about 1 in 5 by 7 years (20.6% in a large U.S. health system study)"
refs = ["femme4", "sandberg18", "mitro24"]
read = "abstract"
[[fact]]
id = "myo-pool"
option = "myomectomy"
simple = ""
deep = "A second pooled analysis disagrees with the first, finding about 1 in 5 by 5 years (19%), lower than after embolization (21%) or focused ultrasound (49%)"
refs = ["xu21"]
read = "abstract"
[[fact]]
id = "rfa-pool"
option = "radiofrequency"
simple = ""
deep = "Pooled across prospective studies, about 1 in 9 women had another procedure for fibroid symptoms by 3 years (11.5%)"
refs = ["bradley19"]
read = "abstract"
[[fact]]
id = "rfa-esonata"
option = "radiofrequency"
simple = ""
deep = "In a prospective study that was not randomized, 27.3% had more surgery by 18 months after radiofrequency through the cervix, against 6.3% after myomectomy"
refs = ["esonata"]
read = "abstract"
[[fact]]
id = "fus-sham"
option = "focused-ultrasound"
simple = ""
deep = "In a small placebo-controlled pilot trial of 20 women, symptoms improved more than after a fake treatment by 12 weeks (31 versus 13 points), but not at 4 weeks"
refs = ["promise"]
read = "abstract"
[[fact]]
id = "fus-repeat"
option = "focused-ultrasound"
simple = ""
deep = "19% by 3 years and 23% by 4 years in one series of 138 women, and 59% by 5 years in another of 162 women"
refs = ["gorny14", "quinn14"]
read = "abstract"
[[fact]]
id = "fus-firstt"
option = "focused-ultrasound"
simple = ""
deep = "In a small trial that randomized some women between focused ultrasound and embolization (83 treated), 13 of 43 (30%) had another fibroid procedure after focused ultrasound, against 5 of 40 (12.5%) after embolization"
refs = ["firstt"]
read = "full text"
[[fact]]
id = "ea-finland"
option = "endometrial-ablation"
simple = ""
deep = "In a Finnish national registry, women with fibroids were more likely to have a hysterectomy after ablation (adjusted hazard ratio 1.78, 95% CI 1.03 to 3.10)"
refs = ["soini17"]
read = "abstract"
[[fact]]
id = "ea-kaiser"
option = "endometrial-ablation"
simple = ""
deep = "In a large U.S. health system study of women treated for fibroids, 35.5% needed another procedure within 7 years of ablation"
refs = ["mitro24"]
read = "abstract"
