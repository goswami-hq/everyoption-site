lede = "GAE vs. knee replacement: strong evidence shows a knee replacement eases pain for most people with severe arthritis, and most new knees last a long time. It is major surgery, with weeks of recovery. Early results for genicular (knee) artery embolization (GAE) are encouraging. Many people have much less pain, nothing in the knee is cut or replaced, and you go home the same day. Doctors are still learning how much of that relief comes from the treatment itself. No study has compared the two treatments with each other.[^amin][^sir26][^evans][^skou15]"
