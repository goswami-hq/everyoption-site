option = "knee-replacement"
certainty = "Strong evidence shows"
headings = { selection = "Who it is for" }
intro = "{d:r2-knee-replacement-intro-45}."
works = "Strong evidence shows a knee replacement eases pain for most people with moderate to severe arthritis, and most new knees last a long time. {d:r2-knee-replacement-works-46}."
evidence = [
  "* **Knee replacement eased pain and improved daily life more than non-surgical care.** {d:r2-knee-replacement-evidence-47}.",
  "* {d:r2-knee-replacement-evidence-48}.",
