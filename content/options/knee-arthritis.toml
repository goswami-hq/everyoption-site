[[detail]]
option = "exercise"
certainty = "Good evidence suggests"
intro = "Exercises build strength and keep the knee moving, usually with a physical therapist's help. Losing weight, if you are overweight, takes stress off the knee.[^mpoa]"
works = "Good evidence suggests exercise helps you use your knee better. It also eases pain a little. Adding weight loss helps more.[^lawford][^idea]"
evidence = [
  "* **Exercise eased pain a little.** {d:r2-exercise-evidence-2}.",
  "* **Diet plus exercise eased pain more than either one alone.** {d:r2-exercise-evidence-3}.",
]
risks = "Pain can make it hard to keep active, so ask for a routine you can keep up. If physical therapy has not helped after several weeks, review the plan with your therapist. That is a reason to adjust it, not to stop being active.[^mpoa]"

[[detail]]
option = "pain-relievers"
certainty = "Strong evidence shows"
intro = "These include acetaminophen, anti-inflammatory pills such as ibuprofen and naproxen, and anti-inflammatory gels that go on the skin.[^mpoa]"
works = "Strong evidence shows anti-inflammatory pills ease knee pain. Gels help some people, with fewer side effects. Acetaminophen helps very little. None of these change the joint itself.[^mpoa][^dacosta21][^machado]"
evidence = [
  "* **Anti-inflammatory pills eased pain.** A large review combined trials of anti-inflammatory pills and opioids for knee and hip arthritis.[^dacosta21]",
  "* **Acetaminophen helped too little to feel.** A review combined the trials that compared it with a dummy pill (a placebo, a pill with no active ingredient).[^machado]",
]
risks = "{d:r2-pain-relievers-risks-4}."

[[detail]]
option = "other-medicines"
certainty = "Good evidence suggests"
intro = "Duloxetine is a prescription pill also used for depression and nerve pain. Opioid pain pills, including tramadol, are another kind of prescription pill.[^mpoa]"
works = "Good evidence suggests duloxetine eases long-term knee pain a little. Opioids ease arthritis pain only slightly.[^bhandari][^dacosta14][^toupin]"
risks = "More people stopped duloxetine because of side effects than stopped a dummy pill. For most people with arthritis, the harms of opioids outweigh their small benefit.[^dacosta21][^bhandari][^dacosta14]"

[[detail]]
option = "embolization"
diagram = true
certainty = "Early results are encouraging"
intro = "In a knee with arthritis, extra small blood vessels grow into the swollen lining of the joint. In genicular (knee) artery embolization (GAE), an interventional radiologist passes a thin tube through a tiny skin nick, usually at the groin, and guides it to the small arteries around the knee. You get numbing medicine at the skin and medicine to help you relax. You are not put to sleep. The doctor then releases tiny particles that block the extra vessels. Doctors think this calms the swelling and the pain nerves beside those vessels, but this is still being researched.[^sir26][^bsir][^ucla][^cus26]\n{d:r2-embolization-intro-5}.\nRelief after GAE often starts within about two weeks. Nothing in the knee is cut or replaced, so you keep your own knee and can still have a knee replacement later.[^sir26][^bsir][^ucla]"
works = "Early results are encouraging. {d:r2-embolization-works-6}. GAE also did much better than usual care alone. Doctors are still learning how much of this relief comes from the treatment itself: three small trials have compared GAE with a fake procedure so far. Those trial results have prompted multiple larger trials which are currently under way to better investigate this procedure.[^lanza][^amin][^kumar26][^cus24][^sir26]"
evidence = [
  "* **Pain dropped a lot and stayed down for at least a year.** {d:r2-embolization-evidence-7}.",
  "* {d:r2-embolization-evidence-8}.",
  "- {d:r2-embolization-evidence-9}.",
  "- {d:r2-embolization-evidence-10}.",
  "- {d:r2-embolization-evidence-11}.",
  "* **GAE did much better than usual care alone.** {d:r2-embolization-evidence-12}.",
  "* **GAE vs. a fake procedure: three small trials so far.** In a fake procedure (a sham), the doctor does every step except blocking the vessels, and people are not told which one they had.",
  "- {d:r2-embolization-evidence-13}.",
  "- {d:r2-embolization-evidence-14}.",
  "- {d:r2-embolization-evidence-15}.",
  "- {d:r2-embolization-evidence-16}.",
  "* **Some people have a second GAE.** {d:r2-embolization-evidence-17}.",
  "* **The two kinds of blocking material did about the same.** {d:r2-embolization-evidence-18}.",
]
risks = [
  "GAE is not surgery. There is no cut into the knee, no implant, and no general anesthesia, and you go home the same day. Most side effects are minor and go away on their own.[^sir26][^bsir]",
  "* **Skin color change over the knee:** {d:r2-embolization-risks-19}.",
  "* **Any minor side effect:** {d:r2-embolization-risks-20}.",
  "* **A small skin sore over the knee:** {d:r2-embolization-risks-21}.",
  "* **A small patch of bone that loses its blood supply:** {d:r2-embolization-risks-22}.",
  "* **Numbness or tingling in the lower leg:** {d:r2-embolization-risks-23}.",
  "* **Serious problems are rare.** {d:r2-embolization-risks-24}.",
]
selection = "{d:r2-embolization-selection-25}.\n{d:r2-embolization-selection-26}."
fit = "The Society of Interventional Radiology says GAE should be offered to people whose knee arthritis pain has not improved with non-surgical treatment and who cannot have, do not want, or want to delay a knee replacement. It also calls for larger trials.[^sir26]"
unknown = [
  "* **How much of the relief comes from GAE itself.** {d:r2-embolization-unknown-27}.",
  "* **Whether it delays a knee replacement.** {d:r2-embolization-unknown-28}.",
  "* **How it compares with knee replacement, shots, or nerve ablation.** No finished study has tested GAE against any of them.[^sir26]",
  "* **Whether it slows the arthritis.** {d:r2-embolization-unknown-29}.",
]

[[detail]]
option = "steroid"
certainty = "Studies disagree"
intro = "A steroid medicine is injected into the knee during an office visit.[^mpoa]"
works = "Studies disagree on how much a steroid shot helps. {d:r2-steroid-works-30}. Getting shots again and again does not add relief.[^mpoa][^juni][^mcalindon]"
evidence = [
  "* **Relief fades within months.** {d:r2-steroid-evidence-31}.",
  "* **Repeat shots did not ease pain more than salt-water shots.** {d:r2-steroid-evidence-32}.",
  "* **Physical therapy did better than steroid shots over a year.** {d:r2-steroid-evidence-33}.",
]
risks = [
  "* **Repeat shots may wear down the knee cushion faster.** {d:r2-steroid-risks-34}.",
  "* **Before a knee replacement.** {d:r2-steroid-risks-35}.",
]

[[detail]]
option = "hyaluronic"
certainty = "Strong evidence shows"
intro = "A gel is injected into the knee. It is meant to add to the joint fluid, which thins with arthritis.[^cus26]"
works = "Strong evidence shows gel shots ease pain only slightly more than dummy shots. The difference is too small for most people to feel.[^pereira]"
evidence = [
  "* **Gel shots did about the same as dummy shots.** {d:r2-hyaluronic-evidence-36}.",
]
risks = "The knee can be sore or swollen for a short time. In the same review, serious side effects were about one and a half times as common with gel shots as with dummy shots.[^cus26][^pereira]"

[[detail]]
option = "prp"
certainty = "Studies disagree"
intro = "Platelets are taken from your own blood and injected into the knee.[^cus26][^restore]"
works = "Studies disagree on whether PRP helps. {d:r2-prp-works-37}. The largest trial found it did about the same as a salt-water shot after a year.[^auroux][^restore]"
evidence = [
  "* **In the largest trial, PRP did about the same as a salt-water shot.** {d:r2-prp-evidence-38}.",
]
risks = "Side effects were mild and short in the largest trial. The sources we read give no rates.[^restore]"

[[detail]]
option = "nerve-ablation"
certainty = "Studies disagree"
intro = "Heat from a needle quiets the nerves that carry pain from the knee. The sources we read do not describe the steps or the recovery well enough to state them.[^cus26]"
works = "Studies disagree on whether it helps. {d:r2-nerve-ablation-works-39}. Longer relief has not been shown.[^almeida][^malaithong]"
evidence = [
  "* **Compared with a fake procedure, it did about the same after a year.** {d:r2-nerve-ablation-evidence-40}.",
  "* **Compared with a steroid shot, more people had their pain cut in half.** {d:r2-nerve-ablation-evidence-41}.",
  "* **The trials are weak overall.** {d:r2-nerve-ablation-evidence-42}.",
]
risks = "Serious problems were no more common than with a fake procedure. The sources we read give no rates.[^almeida]"

