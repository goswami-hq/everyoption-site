[[detail]]
option = "partial-replacement"
intro = "The surgeon replaces only the worn part of the knee, usually the inner side.[^mpoa][^topkat]"
works = "It is an option when only one part of the knee is worn. {d:r2-partial-replacement-works-60}. A partial knee is more likely to need redoing later.[^evans][^topkat]"
evidence = [
  "* **Partial and full replacement did about the same.** {d:r2-partial-replacement-evidence-61}.",
]
risks = "{d:r2-partial-replacement-risks-62}."

[[detail]]
option = "osteotomy"
certainty = "Early studies suggest"
intro = "The surgeon cuts and reshapes the shin bone to shift weight off the worn inner side of the knee. It is mainly for younger, active people with bow legs.[^birmingham][^loke]"
works = "Early studies suggest it eases symptoms more than non-surgical care. This comes from one trial at one hospital.[^birmingham]"
evidence = [
  "* **Some people later have a knee replacement.** {d:r2-osteotomy-evidence-63}.",
]
risks = [
  "* **Any complication:** {d:r2-osteotomy-risks-64}.",
  "* **Compared with a partial knee replacement,** complications and repeat surgery were more common after bone realignment, while people could bend the knee further and stay more active.[^ma26]",
]

[[detail]]
option = "scope"
certainty = "Strong evidence shows"
intro = "A camera and small tools go in through small cuts to wash out or trim the inside of the knee.[^mpoa][^moseley]"
works = "Strong evidence shows a knee scope clean-out does not help knee arthritis. A major guideline from orthopedic surgeons advises against it.[^moseley][^kirkley][^aaos]"
evidence = [
  "* **It did about the same as a fake operation.** In a trial that compared the scope with a fake operation, all groups improved by about the same amount.[^moseley]",
  "* **It added nothing to physical therapy and medicines.** A second trial assigned people randomly to the scope plus physical therapy and medicines, or to physical therapy and medicines alone.[^kirkley]",
]
risks = "It carries the risks of surgery, including blood clots and infection. The sources we read give no rates.[^thorlund]"

[[section]]
id = "other-joints"
after = "less-invasive"
heading = "Embolization for other joints"
text = [
  "Doctors are also trying embolization for arthritis in other joints. None of these studies had a comparison group, and no knee result applies to another joint.[^hipe][^feier][^lee24]",
  "* **Hip:** two early studies, one that followed people for a year.[^hipe][^feier]",
  "* **Hand and fingers:** {d:r2-other-joints-43}.",
  "* **Shoulder arthritis:** a formal review found no studies.[^aihta]",
  "* **Frozen shoulder:** {d:r2-other-joints-44}.",
]

[[section]]
id = "one-step-then-the-next"
after = "surgery"
heading = "Does a less invasive step affect later surgery?"
text = [
  "With knee arthritis, waiting does not put your life or your leg at risk. Guidelines step from exercise and medicines to shots, and then to surgery. Knee function can decline while you wait.[^mpoa][^hannon23]",
  "* **After GAE:** {d:r2-one-step-then-the-next-65}.",
  "* **After a steroid shot:** {d:r2-one-step-then-the-next-66}.",
]

