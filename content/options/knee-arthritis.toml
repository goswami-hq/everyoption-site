lede = "GAE vs. knee replacement: strong evidence shows anti-inflammatory pills ease knee pain and most new knees last a long time. Good evidence suggests exercise helps you use your knee better. Early results for genicular (knee) artery embolization (GAE) are encouraging, though doctors are still learning how much of the relief comes from the treatment itself."
read_intro = "This page is for readers who want the studies behind the short guide. Each treatment starts with the conclusion and how sure we are, in the same certainty words the short guide uses. Then come the study sizes, designs, comparison groups, follow-up, harms and how they were counted, who was studied, funding, and what is not known."
reading_note = [
  "Numbers from different studies are not head-to-head comparisons. They come from different people, follow-up times, and outcome measures, so this page never lines them up as if they did.",
  "A number read only in a study's abstract, not its full paper, is marked (abstract only).",
  "Every Option's physician performs knee embolization. It is held to the same standard of evidence as every other option here.",
]
