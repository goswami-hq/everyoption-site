read = "page"
[[fact]]
id = "vanoost"            # C5
option = "banding"
simple = ""
deep = "one multicenter randomized trial in grade 3 hemorrhoids, 87 patients, stopped early: recurrence 48.8% after banding vs 6.1% after hemorrhoidectomy, with up to 2 banding sessions allowed; back to work at 1 vs 9 days; first-week pain 1 vs 4"
refs = ["vanoost"]
read = "full text"
[[fact]]
id = "ding"               # C4
option = "infrared"
simple = ""
deep = "9 randomized trials of moderate quality: no significant difference from banding in success, recurrence or prolapse; banding caused more pain and less bleeding afterward"
refs = ["ding"]
read = "abstract"
[[fact]]
id = "johanson"           # C4
option = "infrared"
simple = ""
deep = "an older pooled analysis of 5 trials, 863 patients: similar numbers symptom-free at 12 months, fewer repeat treatments after banding"
refs = ["johanson92"]
read = "abstract"
[[fact]]
