option = "ligation"
simple = ""
deep = "a UK trial of 372 people in 17 centers: recurrence at 1 year 30% after Doppler-guided ligation vs 49% after a single banding, mostly from repeat bandings (counting repeat bandings as success, 30% vs 37.5%, not a significant difference); serious events needing hospital admission 12 (7%) after ligation vs 2 (1%) after banding; more pain on day 1 and day 7 after ligation"
refs = ["brown16"]
read = "full text"
[[fact]]
