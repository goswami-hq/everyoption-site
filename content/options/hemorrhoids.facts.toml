# The tie between the hemorrhoid simple page (content/conditions/hemorrhoids.toml) and its every-option page
# (content/options/hemorrhoids.toml). Job platform-condition-pages-0014, on the fibroid pattern (tools/options.py).
# Shared facts: `simple` must appear in that option's simple text with `refs` cited there; the deep page states it only
# as {f:id}. Deep-only facts (simple = ""): study details for the advanced reader, written {d:id}; `read` says how the
# source was read, and "abstract" prints "(abstract only)". Every number on either page is one of these lines.
# Sources and how each was read: goswami-hq/ai-hq projects/platform/hemorrhoid-page/evidence.md (row in each comment).

# ---- Shared with the simple page ----
[[fact]]
id = "steroid-2wk"        # C2, AGA 2026 BPA 3
option = "creams"
simple = "more than 2 weeks at a time"
deep = "more than 2 weeks at a time"
refs = ["aga"]
[[fact]]
id = "hae-year"           # E6, E7: no bleeding 68.7% (De Gregorio), success 72% (Tradi) at 12 months
option = "embolization"
simple = "about 2 out of 3 people still have little or no bleeding a year later"
deep = "about 2 out of 3 people still have little or no bleeding a year later"
refs = ["degregorio", "tradi"]
[[fact]]
id = "incont"             # C10, late incontinence 2.48% in randomized trials
option = "hemorrhoidectomy"
simple = "about 2 or 3 out of 100"
deep = "about 2 or 3 out of 100"
refs = ["jin25"]

# ---- In-depth page only ----
[[fact]]
id = "alonso"             # C1
option = "fiber"
simple = ""
deep = "7 trials of 378 people: persisting symptoms risk ratio 0.53 (95% CI 0.38-0.73) and bleeding risk ratio 0.50 (0.28-0.89); for prolapse, pain and itching the intervals were wide and crossed no effect"
refs = ["alonso"]
read = "abstract"
[[fact]]
id = "nguyen"             # E1
option = "embolization"
simple = ""
deep = "13 non-randomized studies, 381 patients: clinical success 82% (73-89%), technical success 99%"
refs = ["nguyenhuy"]
read = "abstract"
[[fact]]
id = "aljn"               # E3
option = "embolization"
simple = ""
deep = "22 studies, 810 procedures, not pooled because they differed too much: clinical success 63% to 94%, repeat treatment 8% to 20%"
refs = ["aljnainati"]
read = "full text"
[[fact]]
id = "degreg"             # E6
option = "embolization"
simple = ""
deep = "a prospective registry of 80 patients, grades 1 to 3: no bleeding at 12 months in 68.7%, a second embolization in 21.3%, open hemorrhoidectomy in 5%"
refs = ["degregorio"]
read = "abstract"
[[fact]]
id = "tradi"              # E7
option = "embolization"
simple = ""
deep = "a prospective series of 25 patients: success 72% at 12 months, with 8 of the 18 successes needing 2 sessions"
refs = ["tradi"]
read = "abstract"
[[fact]]
id = "cai"                # E8
option = "embolization"
simple = ""
deep = "a retrospective series of 32 patients with a strict definition of success: 87.5% at 1 month, 59.4% at 6 months, 56.2% at 12 months"
refs = ["cai"]
read = "abstract"
[[fact]]
id = "falsa-design"       # E4
option = "embolization"
simple = ""
deep = "one randomized trial against hemorrhoidectomy: 33 randomized, 29 treated (15 embolization, 14 closed hemorrhoidectomy), single center, open label, coils only, powered for pain alone"
refs = ["falsarella"]
read = "full text"
[[fact]]
id = "falsa-pain"         # E4
option = "embolization"
simple = ""
deep = "pain at the first bowel movement 0 vs 6.08, and 2.4 vs 28.9 doses of pain medicine"
refs = ["falsarella"]
read = "full text"
[[fact]]
id = "falsa-12"           # E5
option = "embolization"
simple = ""
deep = "at 12 months, symptoms remained in 6 of 13 after embolization and 5 of 13 after surgery, a trial too small to show the two match; satisfied or very satisfied 8 of 13 vs 13 of 13; 2 of 15 embolization patients went on to surgery"
refs = ["falsarella"]
read = "full text"
[[fact]]
id = "bagla"              # E9, B5
option = "embolization"
simple = ""
deep = "the largest U.S. series, 134 patients at one outpatient center, about half after earlier banding: all home 2 hours after; success 93% at 1 month, with no longer follow-up"
refs = ["bagla"]
read = "full text"
[[fact]]
id = "kucu-ulcer"         # E14
option = "embolization"
simple = ""
deep = "a small randomized trial of particle sizes that looked with a scope: superficial ulcers in 71.4% with the smallest particles and 0% with the largest, healed by 6 months; 3 of 14 in the smallest-particle group had deeper rectosigmoid ulcers that needed enema treatment and healed after 6 months"
refs = ["kucukay"]
read = "full text"
[[fact]]
id = "tenesmus"           # E13
option = "embolization"
simple = ""
deep = "an urge to go (tenesmus) in 53.1% and low fever in 34.4% in one series, and tenesmus in 81.8% easing in 3 to 5 days in another"
