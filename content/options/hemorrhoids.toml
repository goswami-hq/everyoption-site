[[detail]]
option = "fiber"
certainty = "Good evidence suggests"
intro = "Fiber from food or a supplement softens stool, and the advice is to avoid straining or sitting a long time on the toilet. Guidelines call this a reasonable first step.[^aga]"
works = "Good evidence suggests fiber eases symptoms and lowers the chance of bleeding. It may not help much with bulging, pain, or itching.[^alonso]"
evidence = ["{d:alonso}. The trials are older and of moderate quality."]
risks = "Mild side effects were a little more common with fiber, a difference that could be chance.[^alonso]"
fit = "The AGA lists fiber and changes in toilet habits as first-line care.[^aga]"
unknown = "Whether fiber stops hemorrhoids from coming back has hardly been tested.[^alonso]"

[[detail]]
option = "creams"
certainty = "Not yet well studied"
intro = "Numbing creams, witch hazel, steroid creams, and sitz baths are widely used.[^aga]"
works = "Not yet well studied: there is little proof that they help.[^aga]"
risks = "Steroid creams should not be used for {f:steroid-2wk}.[^aga]"
fit = "The AGA says they can be considered, with little data to support them.[^aga]"

[[detail]]
option = "embolization"
certainty = "Early results are encouraging"
intro = "A catheter enters the wrist or groin artery, under local numbing and light sedation, and is guided to the superior rectal arteries that feed the hemorrhoids. Coils, particles, or both block them; the middle rectal arteries are sometimes treated too. No embolic agent is proven best.[^bagla][^falsarella][^kucukay]"
works = "Early results are encouraging. Most people bleed less, and {f:hae-year}. Some need a second treatment or surgery. It is mainly a treatment for bleeding.[^nguyenhuy][^aljnainati][^falsarella]"
evidence = [
  "Pooled data: {d:nguyen}. Every included study was before-and-after only.",
  "{d:aljn}. The authors judged pooling misleading.",
  "How long it lasts: {d:degreg}; {d:tradi}; {d:cai}.",
  "Against surgery: {d:falsa-design}. {d:falsa-pain}. {d:falsa-12}. The surgery arm had less bleeding at baseline. A device maker supplied grants and equipment.",
  "Outpatient practice: {d:bagla}. The first author consults for device makers.",
  "Frail patients: {d:campenni}.",
  "Bulging: grade did not change in the particle-size trial, and other series report small or short-lived changes. The procedure does not lift tissue (our inference from how it works).[^kucukay][^aljnainati]",
]
risks = "Expect a few days of rectal pressure, urge to go or low fever: {d:tenesmus}.\nSmall ulcers are found when patients are scoped: {d:kucu-ulcer}. Most series do not scope routinely, so they undercount ulcers.\nSerious bowel injury has been reported more than once, with no reliable rate: {d:deoliv}; a case of ischemia with narrowing; and a case report of colonic ischemia and necrosis (title only).[^eberspacher][^hess] Loss of bowel control has not been reported.[^aljnainati]"
selection = "Studied mostly in people with bleeding hemorrhoids of {d:g13} that did not respond to other care, some too sick for surgery, some who refused it. Pregnancy, active inflammatory bowel disease, poor kidney function and dye allergy are commonly excluded from trials.[^aljnainati][^brussel] It is not a treatment for a clotted hemorrhoid or a fissure.[^aga]"
fit = "{d:nice}. An Italian colorectal consensus reserves it for selected patients with disabling, refractory symptoms and no bulging that cannot be pushed back. The AGA review does not mention it. We found no SIR or CIRSE position.[^siccr][^aga]"
unknown = "How it compares with banding or artery ligation, and results {d:two-years}. {d:trials}. If it works for you, it may spare you surgery, but no study has measured that against a comparison group.[^degregorio]"

[[detail]]
option = "banding"
certainty = "Good evidence suggests"
intro = "A rubber band is placed above the pain-sensing line inside the anus, around the base of an internal hemorrhoid, which then shrinks and falls off.[^niddk][^aga]"
works = "Good evidence suggests banding works well for many people. Hemorrhoids come back more often than after surgery, and some people need more than one session.[^vanoost][^johanson92]"
evidence = ["Against surgery: {d:vanoost}.", "Against infrared: see infrared treatment below.[^ding]"]
risks = "Pain and pressure for a few days, and some bleeding when the band falls off. A serious pelvic infection is rare after any hemorrhoid treatment.[^ding][^aga]"
fit = "The AGA advises banding or infrared treatment before surgery for {d:aga-g13}, and a surgeon's opinion for {d:aga-g3}.[^aga]"
unknown = "How banding compares with embolization; trials are under way.[^brussel][^stratos]"

[[detail]]
option = "infrared"
certainty = "Studies disagree"
intro = "Infrared light from a probe scars the hemorrhoid so it shrinks.[^niddk]"
works = "Studies disagree on whether it lasts as long as banding. It helps about as much as banding at first.[^aga][^ding][^johanson92]"
evidence = ["{d:ding}.", "{d:johanson}."]
risks = "Less pain than banding, somewhat more bleeding afterward.[^ding]"
fit = "The AGA says banding gives longer benefit for bulging and repeat bleeding, and prefers infrared over banding when blood clotting is badly impaired.[^aga]"

[[detail]]
option = "injection"
certainty = "Early studies suggest"
intro = "A chemical injected into the hemorrhoid scars it.[^gallo]"
works = "Early studies suggest it works about as well as the treatments it was compared with.[^gallo]"
evidence = ["{d:gallo}."]
risks = "Fewer complications than the treatments compared.[^gallo]"
unknown = "Long-term results; the authors call for more research.[^gallo]"

[[detail]]
option = "ligation"
certainty = "Early studies suggest"
intro = "Doppler-guided artery ligation, also called dearterialization: an ultrasound probe in the anus finds the feeding arteries, which are tied with stitches; a lifting stitch (mucopexy) is sometimes added.[^brown16][^jee]"
works = "Early studies suggest it helps, but hemorrhoids come back more often than after excision. It may last longer than a single banding.[^jee][^brown16]"
evidence = ["{d:hubble}.", "{d:jee}."]
risks = "More pain than banding in the first week; serious events needing a hospital stay were more common after ligation than after banding in the UK trial.[^brown16]"
fit = "It targets the same arterial inflow as embolization, so durability may behave alike (our inference; no trial tests this).[^jee]"

[[detail]]
option = "stapled"
certainty = "Good evidence suggests"
intro = "A circular stapler removes a ring of tissue above the hemorrhoids and lifts them back into place.[^lauricella]"
works = "Good evidence suggests symptoms, mostly bulging, come back more often than after standard surgery.[^lauricella]"
evidence = ["{d:lauri}."]
risks = "Long-term pain, bowel function and quality of life were about the same as after hemorrhoidectomy.[^lauricella]"

[[detail]]
option = "laser"
certainty = "Early studies suggest"
intro = "A diode laser fiber shrinks the hemorrhoid from inside.[^pompeu]"
works = "Early studies suggest it hurts less than standard surgery. How long it lasts is not yet known.[^pompeu]"
evidence = ["{d:pompeu}."]
risks = "Less bleeding, urinary retention and anal narrowing than after excision in the pooled trials.[^pompeu]"
unknown = "Long-term results; the authors do not suggest it replace excision.[^pompeu]"

[[detail]]
option = "hemorrhoidectomy"
certainty = "Good evidence suggests"
intro = "The hemorrhoids are cut out, with the wounds closed or left open.[^jin21]"
works = "Good evidence suggests it is the most lasting fix. Hemorrhoids come back less often than after banding or other procedures.[^jin21][^vanoost]"
evidence = ["{d:jin21}.", "Against banding: {d:vanoost}."]
risks = "Pain, bleeding and urinary retention are more common than after office procedures.[^jin21] Lasting incontinence: {d:jin25}."
fit = "The AGA says {d:aga-g4}.[^aga]"

[[section]]
id = "after-banding"
after = "top"
heading = "Bleeding after banding: how the paths compare"
toc = "Bleeding after banding"
text = [
  "For bleeding that keeps coming back after office care, the choice is usually more office treatment, embolization, or surgery. Surgery has the strongest record for lasting results and the hardest recovery.[^jin21][^vanoost] Embolization spares the painful recovery and treats bleeding, but its benefit fades for some within a year and it does not treat bulging.[^falsarella][^aljnainati][^kucukay] No trial has compared embolization with banding yet.[^brussel][^stratos]",
]

[[section]]
id = "natural-history"
after = "home"
heading = "Do hemorrhoids get better without a procedure?"
toc = "Without a procedure"
text = [
  "{d:jensen}. The data are old and small, so this is a reason to start simple, not a promise.",
]

[[section]]
id = "insurance"
after = "end"
heading = "Does insurance cover hemorrhoid embolization?"
toc = "Insurance"
text = [
  "Coverage varies by plan. Cigna's guideline covers it under set conditions after failed non-surgical care. UnitedHealthcare lists it as unproven in a policy effective {d:uhc-date}, and Aetna lists it as experimental. Medicare decides case by case. Many insurers have no written policy.[^cigna][^uhc][^aetna][^ncd] [Each insurer's policy, in plain words](/insurance/#hae).",
]

