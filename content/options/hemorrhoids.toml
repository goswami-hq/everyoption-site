[[detail]]
option = "fiber"
certainty = "Good evidence suggests"
intro = "Fiber from food or a supplement softens stool, and the advice is to avoid straining or sitting a long time on the toilet. The AGA review calls this a reasonable first step.[^aga]"
works = "Good evidence suggests fiber eases symptoms and lowers the chance of bleeding. It may not help much with bulging, pain, or itching.[^alonso]"
evidence = [
  "{d:alonso-n}:",
  "* **Fewer symptoms:** {d:alonso-sym}.",
  "* **Less bleeding:** {d:alonso-bleed}.",
  "* **Bulging, pain, and itching:** no clear effect. The ranges were wide and included no difference at all.",
  "* The trials are older and of moderate quality.",
]
risks = "Mild side effects were more common with fiber in the trials, but the difference could be chance.[^alonso]"
fit = "The AGA lists fiber and changes in toilet habits as first-line care.[^aga]"
unknown = "Whether fiber stops hemorrhoids from coming back has not been well tested.[^alonso]"

[[detail]]
option = "creams"
certainty = "Early studies suggest"
ruled = "2026-11-10"   # his line opens the bottom line (his clinical judgment, vault/decisions.md 2026-11-10)
intro = "These treat symptoms, not the hemorrhoid itself. That is often enough: many people mainly need the bleeding, itching, or soreness to settle, and doctors often recommend them for that. The AGA says warm baths are often advised and creams can be considered.[^aga]"
works = "Many people find they ease symptoms for a while, but there is little proof they help in the long run. Small trials of single creams suggest short-term relief. Warm baths may also provide some symptomatic relief. Neither has been shown to make hemorrhoids go away or stop them coming back.[^aga][^sturiale][^sahin][^mehdi][^kwok][^shafik]"
evidence = [
  "* **Creams eased symptoms over a few weeks in small trials.** Each tested one product against a cream with no active ingredient (a placebo):",
  "- {d:sturiale}.",
  "- {d:sahin}.",
  "- {d:mehdi}.",
  "* **Numbing ointment helps briefly after banding.** {d:kwok}.",
  "* **Warm baths relax the anal muscle for a while.** {d:shafik}.",
  "* These trials are small and short, and each tested a single product. Results may not carry over to other creams.",
]
risks = "Steroid creams should not be used for {f:steroid-2wk}.[^aga] Use warm, not hot, water: a burn from a hot sitz bath has been reported.[^kahraman]"
fit = "The AGA says warm baths are often advised to ease symptoms, with limited data, and that creams can be considered, with little data to support them.[^aga]"
unknown = "Which creams work best, and whether any of them help beyond a few weeks.[^aga]"

[[detail]]
option = "flavonoid"
certainty = "Early studies suggest"
intro = "Flavonoids are plant compounds taken as pills. They are one kind of vein medicine (phlebotonic); the group also includes some synthetic drugs. Like creams, they ease symptoms rather than remove the hemorrhoid.[^alonsoflav][^perera]"
works = "Early studies suggest flavonoid pills ease bleeding and itching; the two large reviews disagree on pain. There are many trials, but they are of limited quality.[^alonsoflav][^perera]"
evidence = [
  "{d:flav-n}:",
  "* **Fewer people still had symptoms:** {d:flav-sym}.",
  "* **Less bleeding:** {d:flav-bleed}.",
  "* **Less pain and itching:** {d:flav-pain}.",
  "* **Fewer returns:** {d:flav-return}.",
  "* **A Cochrane review agreed:** {d:perera-n}, vein pills (phlebotonics, which include flavonoids and some synthetic drugs) meant less bleeding, itching, and leakage than a comparison treatment, and more people improved overall. Unlike the first review, it found no clear effect on pain.",
  "* The trials varied a lot, their quality was limited, and the authors worried that trials with poor results may never have been published.[^alonsoflav]",
]
risks = "The Cochrane review found few safety concerns in the trials.[^perera] In pregnancy, {d:quijano} found a related pill eased symptoms, but said it should not be recommended until its safety is shown."
unknown = "How they compare with office treatments such as banding and how long the benefit lasts after stopping.[^alonsoflav]"

[[detail]]
option = "embolization"
diagram = true
certainty = "Early results are encouraging"
intro = "A doctor guides a thin tube through a tiny skin nick in the wrist or groin to the arteries that feed the hemorrhoids. You get numbing medicine at the skin and medicine to help you relax. Tiny metal coils, tiny beads, or both then block those arteries. No one material is proven best.[^bagla][^falsarella][^kucukay]"
works = "Early results are encouraging. Most people bleed less, and {f:hae-year}. Some need a second treatment or surgery. It is mainly a treatment for bleeding.[^nguyenhuy][^aljnainati][^falsarella][^cai]"
evidence = [
  "* **Most bleed less at first.** {d:nguyen}. Every study followed one group before and after, with no comparison group.",
  "* **Results vary from center to center.** {d:aljn}. The authors judged the studies too different to combine into one number.",
  "* **The benefit fades for some within a year.**",
  "- {d:degreg}.",
  "- {d:tradi}.",
  "- {d:cai}.",
  "* **Against surgery: far less pain early.** {d:falsa}. Its limits: one center, patients and doctors knew the treatment, coils only, designed to measure pain alone, and a device maker supplied grants and equipment.",
  "* **In everyday U.S. practice:** {d:bagla}. The first author consults for device makers.",
  "* **In frail patients:** {d:campenni}.",
  "* **Bulging:** grade did not change in the particle-size trial, and other series report small or short-lived changes. The procedure does not lift tissue.[^aljnainati][^kucukay]",
]
risks = [
  "{d:emb-avoids}.",
  "* **Common and short-lived:** a few days of rectal pressure, urge to go, or low fever. {d:tenesmus}.",
  "* **Small ulcers, which healed:** {d:kucu-ulcer}. Most series do not look with a scope, so they undercount ulcers.",
  "* **Serious bowel injury: possible, but rare.** It has been reported more than once, with no reliable rate. Case reports describe bowel damage from poor blood flow, including one hole in the bowel that needed an operation and one narrowing of the bowel.[^aljnainati][^deoliveira][^eberspacher][^hess]",
  "* Loss of bowel control has not been reported.[^aljnainati]",
]
selection = "Studied mostly in people with bleeding hemorrhoids of {d:g13} that did not respond to other care, some too sick for surgery, some who refused it. Pregnancy, active inflammatory bowel disease, poor kidney function, and dye allergy are commonly excluded from trials.[^brussel] It is not a treatment for a clotted hemorrhoid or a fissure.[^aga]"
fit = [
  "* {d:nice}.",
  "* An Italian colorectal consensus reserves it for selected patients with disabling symptoms that other care has not helped, and no bulging that cannot be pushed back.[^siccr]",
  "* The AGA review's summary does not mention it. We found no position from the U.S. or European interventional radiology societies (SIR or CIRSE).[^aga]",
]
unknown = [
  "* How it compares with banding or artery tying.[^aljnainati]",
  "* Results {d:two-years}.[^degregorio]",
  "* Trials under way: {d:trials}.",
  "* If it works for you, it may spare you surgery. No study has measured that against a comparison group.",
]

[[detail]]
option = "banding"
certainty = "Good evidence suggests"
intro = "A rubber band is placed above the pain-sensing line inside the anus, around the base of an internal hemorrhoid, which then shrinks and falls off.[^niddk][^aga]"
works = "Good evidence suggests banding works well for many people. Hemorrhoids come back more often than after surgery, and some people need more than one session.[^vanoost][^johanson92]"
evidence = [
  "* **Against hemorrhoid removal:** {d:vanoost-n}:",
  "- {d:vanoost-back}.",
  "- {d:vanoost-work}.",
  "- {d:vanoost-pain}.",
  "* **Against infrared:** see the infrared treatment section.[^ding]",
]
risks = "Pain and pressure for a few days, and some bleeding when the band falls off. {d:band-problems}. {d:band-hospital}. A serious pelvic infection is rare after any hemorrhoid treatment.[^aga][^ding]"
fit = "The AGA advises banding or infrared treatment before surgery for {d:aga-g13}, and a surgeon's opinion for {d:aga-g3}.[^aga]"
unknown = "How banding compares with embolization; trials are under way.[^brussel][^stratos]"

[[detail]]
option = "infrared"
certainty = "Studies disagree"
intro = "Infrared light from a probe scars the hemorrhoid so it shrinks.[^niddk]"
works = "Studies disagree on whether it lasts as long as banding. It helps about as much as banding at first.[^aga][^johanson92][^ding]"
evidence = [
  "* **About the same as banding:** {d:ding}.",
  "* **Fewer repeat treatments after banding:** {d:johanson}.",
]
risks = "Less pain than banding; bleeding afterward was no different.[^ding]"
fit = "The AGA says banding gives longer benefit for bulging and repeat bleeding, and, for people with cirrhosis whose blood clotting is badly impaired, prefers infrared over banding.[^aga]"

[[detail]]
option = "injection"
certainty = "Early studies suggest"
intro = "A chemical injected into the hemorrhoid scars it.[^gallo]"
works = "Early studies suggest it works about as well as banding and other non-surgical treatments.[^gallo]"
evidence = [
  "{d:gallo-n}. The authors pooled these comparisons together, and results varied a lot from trial to trial:",
  "* **Same success:** {d:gallo-success}.",
  "* **Fewer complications:** {d:gallo-comp}.",
]
unknown = "Long-term results; the authors call for more research.[^gallo]"

[[detail]]
option = "ligation"
certainty = "Early studies suggest"
intro = "Doppler-guided artery ligation, also called dearterialization: an ultrasound probe in the anus finds the feeding arteries, which are tied with stitches; a lifting stitch (mucopexy) is sometimes added.[^jee][^brown16]"
works = "Early studies suggest it helps, but hemorrhoids come back more often than after removal. It may last longer than a single banding.[^jee][^brown16]"
evidence = [
  "* **Against banding:** {d:hubble-n}:",
  "- {d:hubble-back}.",
  "- Most of that gap came from people who needed repeat banding. {d:hubble-repeat}.",
  "- {d:hubble-serious}.",
  "- {d:hubble-pain}.",
  "* **Against removal:** {d:jee}.",
]
risks = "More pain than banding in the first week; serious problems needing a hospital stay were more common after artery tying than after banding in the UK trial.[^brown16]"
unknown = "It targets the same blood supply as embolization, so how long it lasts may be similar. No trial has tested this.[^jee]"

[[detail]]
option = "stapled"
certainty = "Good evidence suggests"
intro = "A circular stapler removes a ring of tissue above the hemorrhoids and lifts them back into place.[^lauricella]"
works = "Good evidence suggests symptoms, mostly bulging, come back more often than after standard surgery.[^lauricella]"
evidence = [
  "{d:lauri-n}:",
  "* {d:lauri-bulge}.",
  "* {d:lauri-all}. The low end of the range is no difference, so this part could be due to chance.",
  "* The authors judge that there are still too few patients to be sure.",
]
risks = "Long-term pain, bowel function, and quality of life were about the same as after hemorrhoid removal.[^lauricella] How often problems happen varies widely from study to study.[^porrett] Serious problems are possible, but rare: a hole in the bowel or a severe infection that needed emergency surgery has been reported, including deaths, with no reliable rate.[^cirocco]"

[[detail]]
option = "laser"
certainty = "Early studies suggest"
intro = "A laser fiber shrinks the hemorrhoid from inside.[^pompeu]"
works = "Early studies suggest it hurts less than standard surgery. How long it lasts is not yet known.[^pompeu]"
evidence = [
  "{d:pompeu-n}:",
  "* **Less pain:** {d:pompeu-pain}.",
  "* **Faster recovery:** {d:pompeu-days}.",
  "* **How sure:** low to very low certainty, with short follow-up.",
]
risks = "Less bleeding, trouble passing urine, and narrowing of the anus than after removal in the pooled trials.[^pompeu]"
unknown = "Long-term results; the authors do not suggest it replace removal.[^pompeu]"

[[detail]]
option = "hemorrhoidectomy"
certainty = "Good evidence suggests"
intro = "The hemorrhoids are cut out, with the wounds closed or left open.[^jin21]"
works = "Good evidence suggests it is the most lasting fix. Hemorrhoids come back less often than after banding or other procedures.[^vanoost][^jin21]"
evidence = [
  "* **Fewest hemorrhoid returns, most pain:** {d:jin21}.",
  "* **Against banding:** {d:vanoost-short}; see the banding section.",
]
risks = "Hemorrhoid removal is surgery, and its side effects are more common than those of office treatments.[^jin21] Trouble passing urine right after surgery: {d:hx-urine}. Bleeding that starts days later: {d:hx-bleed}. Back in the hospital within a month: {d:hx-readmit}. Narrowing of the anus: {d:hx-narrow}. Lasting loss of some bowel control: {d:jin25}."
fit = "The AGA says {d:aga-g4}.[^aga]"

[[section]]
id = "after-banding"
after = "top"
heading = "Bleeding after banding: how the paths compare"
toc = "Bleeding after banding"
text = [
  "For bleeding that keeps coming back after office care, the choice is usually more office treatment, embolization, or surgery.[^vanoost][^jin21][^falsarella][^aljnainati][^kucukay][^brussel][^stratos]",
  "* **Surgery** has the strongest record for lasting results and the hardest recovery.",
  "* **Embolization:** early studies suggest it spares most of the painful recovery. It treats bleeding, but its benefit fades for some within a year, and it is not known to fix bulging hemorrhoids.",
  "* **More office treatment:** banding can be repeated, and it works well for many people.",
  "* No trial has compared embolization with banding yet.",
]

