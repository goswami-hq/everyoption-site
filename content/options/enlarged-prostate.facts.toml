# "abstract" prints "(abstract only)". Every number on either page is one of these lines; any other fails the build.
# Sources and how each was read: ai-hq projects/platform/pae-page/evidence.md, search/2026-11-06-*.md and
# notes/sexual-function-2026-11-06.md.

