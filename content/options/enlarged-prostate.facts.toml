# The tie between the prostate simple page (content/conditions/enlarged-prostate.toml) and the prostate every-option
# page (content/options/enlarged-prostate.toml). Job platform-main-0019, built on the fibroid pattern (tools/options.py)
# and the knee page's deep-only facts.
# Shared facts: `simple` must appear in that option's simple text with `refs` cited there; the deep page states it only
# as {f:id}. Deep-only facts (simple = ""): study details for the advanced reader (his words, 2026-11-05: "All of these
# specific details we can include on the in depth page"), written {d:id}; `read` says how the source was read, and
# "abstract" prints "(abstract only)". Every number on either page is one of these lines; any other fails the build.
# Sources and how each was read: ai-hq projects/platform/pae-page/evidence.md, search/2026-11-06-*.md and
# notes/sexual-function-2026-11-06.md.

