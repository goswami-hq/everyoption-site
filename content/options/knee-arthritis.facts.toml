# The tie between the knee simple page (content/conditions/knee-arthritis.toml) and the knee every-option page
# (content/options/knee-arthritis.toml). Job platform-main-0020, built on the fibroid pattern (tools/options.py).
# Shared facts: `simple` must appear in that option's simple text with `refs` cited there; the deep page states it only
# as {f:id}. Deep-only facts (simple = ""): study details for the advanced reader (his words, 2026-11-05: "All of these
# specific details we can include on the in depth page"), written {d:id}; `read` says how the source was read, and
# "abstract" prints "(abstract only)". Every number on the deep page is one of these lines; any other fails the build.
# Sources and how each was read: ai-hq projects/platform/arthritis-page/evidence.md (sections 2, 5, 6 to 9).

