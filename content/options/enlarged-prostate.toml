lede = "PAE vs. TURP: strong evidence shows TURP surgery relieves symptoms most of the time. Early results for prostate artery embolization (PAE) are encouraging, and the American Urological Association's {f:aua-year} lists PAE as an option for men with larger prostates. Some men need another treatment later, and early studies suggest this is more likely than after surgery."
read_intro = "The studies behind the short guide. Each treatment starts with the conclusion and how sure we are, in the short guide's words, then the studies, harms and what is not known."
reading_note = [
  "Numbers from different studies are not head-to-head comparisons. They come from different men, follow-up times, and outcome definitions, so this page never lines them up as if they did.",
  "A number read only in a study's abstract, not its full paper, is marked (abstract only).",
  "Symptom scores are the IPSS, where higher is worse. Erection scores are the IIEF or SHIM, where higher is better.",
  "Funding is named where we found it; where it is not named, it was not checked.",
  "Every Option's physician performs prostate artery embolization. It is held to the same standard of evidence as every other option here.",
]
glance_heading = "Compared at a glance: recovery, sex life, and how sure we are"
