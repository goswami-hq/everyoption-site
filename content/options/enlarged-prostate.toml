[[section]]
id = "waiting"
after = "medicines"
heading = "Is waiting safe?"
text = [
  "For most men, yes. The evidence suggests it is reasonable to wait and step up treatment if symptoms get worse.[^niddk][^wasson]",
  "* **In one older trial, men who waited did worse than men who had TURP, but most never needed surgery.** {d:r2-waiting-11}.",
  "Waiting is not safe for men who cannot pass urine, or who have kidney damage or bladder stones from the blockage. They need treatment, often surgery.[^aua][^niddk]",
]

[[section]]
id = "sex"
after = "less-invasive"
heading = "Sex life after each treatment"
text = [
  "Studies count ejaculation changes in different ways. Some count any change, including less semen. Others count only a dry orgasm (semen going into the bladder, called retrograde ejaculation) or losing ejaculation completely. Check what a number counts before comparing it.[^ejac][^lokesh]",
  "* **After PAE, most men keep normal ejaculation.**",
  "- {d:r2-sex-59}.",
  "- {d:r2-sex-60}.",
  "- {d:r2-sex-61}.",
  "* **Ejaculation problems are less common after PAE than after TURP.** When trials were combined, men were about half to two-thirds as likely to have an ejaculation problem after PAE as after TURP.[^cochrane]",
  "* **After TURP and laser surgery, dry orgasms are common.** {d:r2-sex-62}.",
  "* **Erections are usually not affected by PAE.** In studies, erection scores did not drop on average. Against TURP, erection scores were about the same after either treatment. In a study across several countries, the average erection score was the same a year after PAE as before it.[^cochrane][^sapoval24]",
  "* **The lift, steam, implant, and balloon:** each maker's trial reported no new lasting erection or ejaculation problems.[^lift5][^rezum2][^itind][^pinnacle2]",
]

