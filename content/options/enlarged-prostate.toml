[[detail]]
option = "alpha-blockers"
certainty = "Good evidence suggests"
intro = "Tamsulosin and similar pills relax the muscle in the prostate and at the opening of the bladder.[^mpbph][^niddk]"
works = "Good evidence suggests alpha blockers ease symptoms for many men. {d:r2-alpha-blockers-works-1}. These pills treat the symptoms, not the growth. On their own, they do not lower the chance of needing surgery later.[^mpbph][^niddk][^mtops]"
risks = [
  "* **Dizziness is a little more common.** {d:r2-alpha-blockers-risks-2}.",
  "* **Ejaculation may change.** {d:r2-alpha-blockers-risks-3}.",
  "* **Tell your eye surgeon.** If you are planning cataract or glaucoma surgery, tell your eye surgeon you take this medicine. It can affect the iris during the operation.[^flomax]",
]

[[detail]]
option = "shrinking-pills"
certainty = "Strong evidence shows"
intro = "{d:r2-shrinking-pills-intro-4}."
works = "Strong evidence shows these pills lower the chance of needing surgery in men with enlarged prostates. They also lower the chance of becoming unable to pass urine (urinary retention). In men with larger prostates, adding one of these pills to an alpha blocker helps more than an alpha blocker alone.[^mtops][^pless][^proscar][^avodart][^combat]"
evidence = [
  "* **Finasteride cut the chance of needing surgery by about half.** {d:r2-shrinking-pills-evidence-5}.",
  "- {d:r2-shrinking-pills-evidence-6}.",
  "- {d:r2-shrinking-pills-evidence-7}.",
  "* **Two pills together kept more men from getting worse.** {d:r2-shrinking-pills-evidence-8}.",
  "* **The shrinking pill is what lowers the chance of surgery.** A second large trial, paid for by a drug maker, tested dutasteride plus an alpha blocker against each pill alone. The two pills together eased symptoms more than either pill alone. For avoiding surgery, the two pills together did about the same as dutasteride alone.[^combat]",
]
risks = "These pills can lower sex drive, cause erection problems, and mean less semen. They cut the PSA level (a blood test used to check for prostate cancer) by about half, so tell any doctor who checks your PSA that you take one. Both drug labels warn that these pills may raise the chance of a more serious type of prostate cancer.[^proscar][^avodart]"

[[detail]]
option = "tadalafil"
certainty = "Early studies suggest"
intro = "A low daily dose of tadalafil, the erection pill, relaxes muscle in the bladder and prostate.[^niddk][^cialis]"
works = "Early studies suggest it eases symptoms a little. It may suit men who also want help with erections (it is also an erection pill).[^pde5][^cialis]"
evidence = [
  "* **The benefit over a dummy pill was small.** {d:r2-tadalafil-evidence-9}.",
  "* **Side effects were more common than with a dummy pill.** {d:r2-tadalafil-evidence-10}.",
]
risks = "Tadalafil can cause headache, indigestion, and back pain. It must not be taken with nitrate heart medicines. The label does not recommend taking it together with an alpha blocker for prostate symptoms.[^cialis]"

[[detail]]
option = "embolization"
diagram = true
certainty = "Early results are encouraging"
intro = "An interventional radiologist passes a thin tube through a tiny skin nick at the wrist or groin and guides it into the arteries that feed the prostate. You get numbing medicine at the skin and medicine to help you relax. The doctor then releases tiny beads or particles that block that blood flow. With less blood flow, the prostate shrinks over time. Most men do not need a urinary catheter (a tube that drains the bladder).[^sirpt][^ucla] {d:r2-embolization-intro-12}."
works = "Early results are encouraging. {d:r2-embolization-works-13}. The trade-offs: TURP improves urine flow more, and more men need a second procedure after PAE. PAE also eased symptoms far more than a fake procedure, and more than taking two pills.[^sham][^cochrane][^abt18][^partem][^peasy][^knight]"
evidence = [
  "* **PAE eased symptoms far more than a fake procedure.** {d:r2-embolization-evidence-14}.",
  "* **PAE vs. TURP: symptom relief is about the same.** {d:r2-embolization-evidence-15}.",
  "* **PAE vs. TURP: fewer side effects and a shorter hospital stay after PAE.** {d:r2-embolization-evidence-16}.",
  "- {d:r2-embolization-evidence-17}.",
  "- {d:r2-embolization-evidence-18}.",
  "- Urine flow and prostate shrinkage: better after TURP.[^knight]",
  "* **In the largest single trial, symptom relief was close, and side effects were fewer after PAE.** {d:r2-embolization-evidence-19}.",
  "- {d:r2-embolization-evidence-20}.",
  "- {d:r2-embolization-evidence-21}.",
  "- {d:r2-embolization-evidence-22}.",
  "* **PAE eased symptoms more than two pills.** {d:r2-embolization-evidence-23}.",
  "* **PAE vs. laser surgery (HoLEP) in very large prostates: symptom relief was about the same.** {d:r2-embolization-evidence-24}.",
  "- {d:r2-embolization-evidence-25}.",
  "- {d:r2-embolization-evidence-26}.",
  "- {d:r2-embolization-evidence-27}.",
  "- Urine flow: better after HoLEP.",
  "- {d:r2-embolization-evidence-28}.",
  "- No man in either group had a serious problem.[^hope]",
  "* **In very large prostates, open surgery cleared the blockage better.** {d:r2-embolization-evidence-29}.",
  "* **In larger groups of men followed over time, most stayed better for years.** These studies had no comparison group, so they cannot show how much of the relief comes from PAE itself.",
  "- {d:r2-embolization-evidence-30}.",
  "- {d:r2-embolization-evidence-31}.",
]
risks = [
  "PAE does not cut or remove tissue. That is why it avoids most of the risks of surgery.",
  "* **Fewer side effects than TURP.** {d:r2-embolization-risks-32}.",
  "* **Heavy bleeding is very rare.** {d:r2-embolization-risks-33}.",
  "* **A few days of discomfort is common.** A burning feeling when you pee, needing to pee often, or pelvic pain happened to half of the men in one study. It passes in a few days. You may also see a little blood in your urine or stool.[^sirpt][^gstt][^hope]",
  "* **Serious problems are uncommon.** {d:r2-embolization-risks-34}.",
  "* **Beads reaching the bladder, rectum, or penis is rare.** {d:r2-embolization-risks-35}.",
  "* **Erections are usually not affected.** {d:r2-embolization-risks-36}.",
  "* **Ejaculation: most men keep it, and some have less semen.** {d:r2-embolization-risks-37}.",
]
selection = "The trials enrolled men who were fit for either PAE or surgery. In everyday practice, men who choose PAE are often older, with larger prostates. Some take blood thinners, or cannot have surgery. Results in these men may differ from the trial results.[^cochrane][^kristensen][^ukrope]\n**Men who cannot pass urine and depend on a catheter.** {d:r2-embolization-selection-38}."
fit = "{d:r2-embolization-fit-39}.\nThe guideline advises seeing a urologist before PAE, and having PAE done by an interventional radiologist trained in it. It says PAE is one of the options for men on blood thinners. It says men should be told that PAE exposes them to radiation (X-rays). For men who depend on a catheter, it recommends surgery that removes prostate tissue.[^aua]"
unknown = [
  "* **Whether PAE spares a man from surgery or only delays it.** No trial has measured this.[^cochrane][^bilhim]",
  "* {d:r2-embolization-unknown-40}.",
  "* **How PAE compares with laser surgery (HoLEP) in the long run.** The only direct comparison is one small study that ran for a year.[^hope]",
  "* **Whether surgery is harder after PAE.** Small studies show no sign that it is, but there is no good evidence either way.[^cochrane][^bilhim]",
]

[[detail]]
option = "urethral-lift"
certainty = "Early studies suggest"
intro = "Small implants, placed through a scope in the urethra, pull the sides of the prostate apart like curtain tiebacks. Nothing is removed.[^mpbph][^niddk][^mpmin]"
works = "Early studies suggest {d:r2-urethral-lift-works-41}. {d:r2-urethral-lift-works-42}. The lift fits only some prostate sizes and shapes, so ask whether yours fits.[^lift5]"
evidence = [
  "* {d:r2-urethral-lift-evidence-43}.",
  "* **In everyday practice, the number was a little higher.** {d:r2-urethral-lift-evidence-44}.",
]
risks = "Side effects were mostly mild and short-lived: burning, blood in the urine, and a sudden need to pee. The trial reported no new lasting erection or ejaculation problems.[^lift5]"

[[detail]]
option = "water-vapor"
certainty = "Early studies suggest"
intro = "Steam, released through a scope in the urethra, destroys some of the inner prostate tissue. It is often done in the doctor's office.[^niddk][^mpmin]"
works = "Early studies suggest {d:r2-water-vapor-works-45}. {d:r2-water-vapor-works-46}. It was tested only in some prostate sizes, so ask whether yours fits.[^cosmos][^rezum5]"
evidence = [
  "* **Fewer men needed more surgery in the maker's trial than in everyday practice.**",
  "- {d:r2-water-vapor-evidence-47}.",
  "- {d:r2-water-vapor-evidence-48}.",
  "* We do not know how much of that gap comes from the men treated and how much from how the procedure is done outside a trial.",
]
risks = "Side effects were mostly mild and settled quickly. The trials reported no lasting new erection problems.[^rezum5][^rezum2]"

[[detail]]
option = "temporary-implant"
certainty = "Early studies suggest"
intro = "A small folded metal device is left for about a week in the part of the urethra that runs through the prostate. As it opens, it presses grooves into the tissue. Then it is removed.[^mpmin][^itind]"
works = "Early studies suggest it helps some men. Many men also felt better after a fake procedure, so doctors are still learning how much of the relief comes from the device. We do not yet know how long the relief lasts.[^itind][^itind4]"
evidence = [
  "* **More men improved than after a fake procedure, but many improved after the fake procedure too.** {d:r2-temporary-implant-evidence-49}.",
  "- {d:r2-temporary-implant-evidence-50}.",
  "- {d:r2-temporary-implant-evidence-51}.",
  "* **Longer results come from one small study.** {d:r2-temporary-implant-evidence-52}.",
]
risks = "{d:r2-temporary-implant-risks-53}."

[[detail]]
option = "balloon"
certainty = "Early studies suggest"
intro = "A balloon widens the space between the two sides of the prostate. It is coated with a medicine (paclitaxel) meant to keep the channel from closing again.[^pinnacle][^fdaopt]"
works = "Early studies suggest {d:r2-balloon-works-54}."
evidence = [
  "* **Symptoms eased after the balloon, but also a lot after a fake procedure.** {d:r2-balloon-evidence-55}.",
  "- {d:r2-balloon-evidence-56}.",
  "- {d:r2-balloon-evidence-57}.",
  "* {d:r2-balloon-evidence-58}.",
]
risks = "Blood in the urine and bladder infection were the most common side effects. Sexual function was unchanged.[^pinnacle2]"

[[detail]]
option = "turp"
certainty = "Strong evidence shows"
intro = "{d:r2-turp-intro-74}."
works = "Strong evidence shows TURP relieves symptoms most of the time. It is the treatment most other procedures are measured against. {d:r2-turp-works-75}."
evidence = [
  "* **The newer kind of TURP causes less bleeding.** {d:r2-turp-evidence-76}.",
  "* **TURP vs. PAE: symptom relief was about the same.** {d:r2-turp-evidence-77}.",
]
risks = [
  "TURP is a real operation, and its side effects are more common than those of the less invasive treatments.",
  "* **Dry orgasms:** {d:r2-turp-risks-78}.",
  "* **Any side effect:** {d:r2-turp-risks-79}.",
  "* **In the weeks after surgery.** {d:r2-turp-risks-80}.",
  "- {d:r2-turp-risks-81}",
  "- {d:r2-turp-risks-82}",
  "- {d:r2-turp-risks-83}",
  "- {d:r2-turp-risks-84}",
  "- {d:r2-turp-risks-85}",
  "- {d:r2-turp-risks-86}",
  "* **Later on:** {d:r2-turp-risks-87}.",
]

[[detail]]
option = "laser"
certainty = "Early studies suggest"
intro = "A laser, passed through a scope, either shells out the enlarged part of the prostate (called HoLEP) or burns it away. Most men go home the same day or the next, with a urinary catheter for a few days.[^mpmin]"
works = "Early studies suggest HoLEP relieves symptoms at least as well as TURP.[^holepcochrane][^holep]"
evidence = [
  "* **HoLEP vs. TURP: less bleeding and a shorter hospital stay with HoLEP.** {d:r2-laser-evidence-88}",
]
risks = [
  "* **Dry orgasms:** {d:r2-laser-risks-89}.",
  "* **Bleeding and serious problems.** {d:r2-laser-risks-90}.",
  "* **Leaking urine and erection problems** can happen. Leaking is usually short-lived.[^mpmin][^hope]",
]

[[detail]]
option = "waterjet"
certainty = "Early studies suggest"
intro = "A high-pressure water jet, passed through a scope, removes the blocking tissue. A urinary catheter stays in for a few days.[^mpmin][^water5]"
works = "Early studies suggest {d:r2-waterjet-works-91}. This comes from one trial paid for by the maker.[^water5]"
evidence = [
  "* **Waterjet vs. TURP: symptoms improved about as much, and fewer men lost ejaculation.** {d:r2-waterjet-evidence-92}.",
  "- {d:r2-waterjet-evidence-93}.",
  "- {d:r2-waterjet-evidence-94}.",
]
risks = "{d:r2-waterjet-risks-95}."

