lede = "PAE vs. TURP: strong evidence shows TURP surgery relieves symptoms most of the time. Early results for prostate artery embolization (PAE) are encouraging. In the trials that compared them, PAE eased symptoms about as much as TURP, with fewer side effects and a faster recovery. More men need a second treatment after PAE than after surgery. The American Urological Association's {f:aua-year} lists PAE as an option for men with larger prostates.[^cochrane][^knight]"
