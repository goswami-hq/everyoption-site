lede = "UFE vs. myomectomy: both keep the uterus, and good evidence suggests women improve after either one. Some women need another procedure later after either. Embolization works through a tiny skin nick, with no cut in the belly, and recovery takes {f:ufe-recovery} instead of {f:major-recovery}. Hysterectomy is the only treatment that keeps fibroids from returning."
read_intro = "It helps to know all your options before you choose. Here is what each one involves and how well it works. If a less invasive treatment works for you, it may spare you a bigger surgery or delay it."
glance_heading = "Compared at a glance: recovery and which keep the uterus"
