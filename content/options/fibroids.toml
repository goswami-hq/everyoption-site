[[detail]]
option = "non-hormone-medicines"
intro = "You take tranexamic acid only on the days of your period. Pain relievers and iron can help with cramps and tiredness from blood loss.[^mpfib][^txa][^owh]"
works = "These medicines ease bleeding and cramps. They do not touch the fibroids, so symptoms come back when you stop.[^mpfib][^txa]"
risks = "Blood clots from tranexamic acid are possible, but rare.[^txa]"

[[detail]]
option = "hormone-medicines"
certainty = "Strong evidence shows"
intro = "This group includes birth control pills or shots, daily pills that lower hormones, and short-term shots before surgery.[^mpfib][^lupron]"
works = "Strong evidence shows daily hormone-lowering pills greatly reduce bleeding. In a drug-maker-funded trial, bleeding fell greatly for {f:gnrh-bleeding}. Symptoms often come back after stopping.[^owh]"
evidence = [
  "* **The strong evidence is for bleeding over the first months.** {d:gnrh-6mo}.",
  "* **Some women on the dummy pill also improved.** {d:gnrh-placebo}. The medicine's real effect is the gap between the two groups.",
  "* **Use beyond six months rests mostly on extension studies.** In these, every woman knew she was taking the medicine. One study assigned some women by chance to switch to a dummy pill. Most of those who stopped the medicine saw heavy bleeding return.[^libext][^libwd]",
]
risks = "Hot flashes can happen. Some of these medicines weaken bones, so how long you can take them is limited. They are not for women who have had blood clots.[^oriahnn][^myfembree][^lupron]"

[[detail]]
option = "iud"
intro = "A small device placed in the uterus during an office visit releases hormone and thins the lining. It lasts {f:iud-years}."
works = "It lightens periods. It does not treat the fibroids.[^owh]"
risks = "Spotting is common at first. It is more likely to slip out when fibroids are present.[^obg]"

[[detail]]
option = "embolization"
certainty = "Good evidence suggests"
diagram = true
intro = "An interventional radiologist passes a thin tube through a tiny skin nick to the arteries that feed the fibroids. Tiny beads or particles block that blood flow, and the fibroids shrink. You keep your uterus. There is no cut in the belly, so there is no belly scar where a hernia can form. Most women go home the same day.[^sir][^mpfib][^mpuae] Recovery takes {f:ufe-recovery}, compared with {f:major-recovery} after major surgery."
works = "Good evidence suggests most women feel much better: {f:ufe-improve} see their symptoms improve, and {f:ufe-5yr}. Most feel {f:ufe-satisfied}. The tradeoff is that the uterus stays, so {f:ufe-repeat} down the line. Even so, {f:ufe-10yr} entirely."
evidence = [
  "* **Most women's symptoms improve.** {d:ufe-range}.",
  "* **Satisfaction: no clear difference from surgery.** {d:ufe-sat}.",
  "* **Quality of life: no clear lasting difference from myomectomy.** {d:femme-qol}.",
  "* **Taken together:** no clear difference in satisfaction. On quality of life, myomectomy scored somewhat higher at first, and later the gap could be due to chance.[^cochrane][^femme2][^femme4]",
]
risks = "Strong cramping pain, like very bad period cramps, is common in the first few days. It often comes with nausea and a low fever. Doctors call this post-embolization syndrome. It usually eases within a week.[^sir][^rinfo] Early menopause is uncommon: {f:ufe-menopause}. Overall, {f:ufe-serious}."
fit = "A radiology expert panel rates embolization usually appropriate or possibly appropriate across the fibroid situations it reviewed.[^acr] Before you agree to surgery, ask about it."

[[detail]]
option = "radiofrequency"
intro = "Heat from a small needle destroys the fibroid. The doctor uses small cuts in the belly, or goes through the vagina with no cuts. Most women go home the same day.[^mpfib][^sonata3][^halt]"
works = "Results vary from study to study: {d:rfa-sonata}, and {d:rfa-dutch}. The first study was funded by the device maker.[^sonata3]"
evidence = [
  "* **These two figures differ mainly in what they count.**",
  "- The first study counted only surgery for heavy bleeding.[^sonata3]",
  "- The second counted any surgery, most often removing other fibroids through the cervix. It looked back at one center's records.[^dutch]",
  "* **Across several studies, some women needed another procedure.** {f:rfa-pool}.",
  "* **Compared with myomectomy, more women needed a second surgery.** {d:rfa-esonata}.",
]
risks = "Pain and cramps can happen. Serious problems are possible, but were rare in studies.[^sonata3][^dutch]"

[[detail]]
option = "focused-ultrasound"
intro = "Sound waves, guided by an MRI scanner, heat and shrink the fibroid. There is no cut, and most women recover quickly.[^rinfo]"
certainty = "Early studies suggest"
works = "Early studies suggest it eases symptoms. It fits only some fibroids, and some women need more treatment later. Not all insurance covers it, so check first.[^rinfo][^fdapma][^bcbsnc]"
evidence = [
  "* **It eased symptoms more than a fake treatment in one very small trial.** {d:fus-sham}.",
  "* **Repeat treatment is common and rises with time.** {d:fus-repeat}.",
  "* **More women needed another procedure than after embolization.** {d:fus-firstt}.",
]
risks = "Belly pain can happen. Skin burns or bruises can happen and usually heal in a week or two.[^rinfo]"

[[detail]]
option = "endometrial-ablation"
intro = "Heat or cold destroys the lining of the uterus to lighten periods. There are no cuts. Most women go home the same day and recover in {f:ea-recovery}."
works = "It treats the lining, not the fibroids, so they stay in place.[^mpfib] The American College of Radiology's expert panel rates it usually not appropriate for fibroids.[^acr] In studies of heavy bleeding, {d:ea-hyst}."
evidence = [
  "That hysterectomy figure comes from women with heavy bleeding in general, not women with fibroids.[^oderkerk] Studies of women with fibroids come from health records. None is a trial.",
  "* **Women with fibroids more often had a hysterectomy later.** {d:ea-finland}.",
  "* **Some women with fibroids needed another procedure after ablation.** {d:ea-kaiser}.",
]
risks = "Cramps and discharge can last a while. It is not for anyone who may want a future pregnancy.[^mpea][^fdaea]"

[[detail]]
option = "hysteroscopic"
intro = "A thin camera and small tools go through the cervix and remove fibroids growing inside the uterus. There are no cuts, and recovery takes a few days.[^mpfib][^mphysteroscopy][^ccmyo]"
certainty = "Early studies suggest"
works = "Early studies suggest it helps. It only works for fibroids inside the uterus. New fibroids can form later.[^mpfib][^owh]"
risks = "Cramps and light bleeding can last a few days. Heavy bleeding, infection, or a tear in the uterus are possible, but rare.[^mphysteroscopy]"

[[detail]]
option = "myomectomy"
certainty = "Good evidence suggests"
intro = "Surgery removes the fibroids and leaves the uterus. It takes a larger cut in the belly or a few small cuts. Recovery takes {f:major-recovery}.[^mpfib]"
works = "Good evidence suggests women's quality of life improves.[^femme2] But small or deep fibroids can be missed, and the more you have, the harder it is to remove them all.[^mayomyo][^aktoz] New ones can also grow, and {f:myo-repeat} down the line.[^mpfib][^ccmyo]"
evidence = [
  "* **Repeat procedures rise over time.** {d:myo-time}.",
  "* **A second combined analysis found a higher rate.** {d:myo-pool}.",
]
risks = "Infection, blood clots, and harm to nearby organs are possible, but not common.[^ccmyo] Bleeding is the main risk: {d:myo-transfusion}. Scar tissue (adhesions) forms inside the belly in most women. It often causes no symptoms, but it can cause pain or block the bowel.[^asrm][^ccadh] After open surgery, {f:hernia}."

[[detail]]
option = "hysterectomy"
intro = "Surgery removes the whole uterus, through the vagina, small cuts, or a larger cut in the belly. Recovery takes {f:major-recovery}.[^mphyst]"
# His Doc comment 2026-11-11: "This is the biggest comparison treatment patients are looking at. Why is this the
# shortest section?" Evidence: ai-hq projects/platform/content/pages/sources/fibroids-evidence-2026-11-11-hysterectomy.md
works = "It is the only treatment that keeps fibroids from returning. Periods stop, so the heavy bleeding from fibroids ends. Most women feel much better afterward and stay satisfied years later.[^owh][^ccmyo][^emmy][^kjerulff] It also ends the chance of pregnancy."
evidence = [
  "* **Compared with embolization: no clear difference in quality of life.** {d:hyst-emmy}.",
  "* **More women needed more treatment after embolization, but most kept their uterus.** {d:hyst-reint}.",
  "* **Most women go home the same day after embolization.** {d:hyst-stay}.",
  "* **How the surgery is done changes recovery.** {d:hyst-route}.",
  "* **Most women improve, but not all.** {d:hyst-maryland}.",
]
risks = """Bleeding, infection, blood clots, and harm to nearby organs can happen.[^mphyst] {d:hyst-harms}.
Menopause begins right away if both ovaries are also removed.[^mphyst] Scar tissue can make organs stick together. A blocked bowel from scar tissue is possible, but rare.[^asrm][^ccadh] After open surgery, {f:hernia}.
Longer-term effects are less certain, because they come from studies that followed women after surgery, not from trials.
{d:hyst-ovary}.
{d:hyst-sui}.
{d:hyst-heart}."""

