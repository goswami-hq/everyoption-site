[[detail]]
option = "embolization"
certainty = "Early results are encouraging"
headings = { selection = "Will I need another treatment later?" }
intro = "A doctor guides a thin tube through a tiny skin nick to the wide veins near the ovaries and uterus. Tiny coils, plugs, a medical glue, or a medicine then close those veins.[^strobl]\nYou get numbing medicine at the skin, and sometimes medicine to help you relax. Most women go home the same day. Some centers keep women overnight.[^hansrani][^cpp-rossi][^cpp-eleissawy]"
works = "Early results are encouraging. {d:cpp-embolization-works-3}. In the one trial that compared embolization with a fake procedure, embolization eased pain more. More research is under way. It is an option to look into if you have not found relief with anything else.[^hansrani][^daniels][^cpp-degregorio]"
evidence = [
  "* **Embolization eased pain more than a fake procedure (a sham).** {d:cpp-embolization-evidence-4}.",
  "- {d:cpp-embolization-evidence-5}.",
  "- Quality of life improved after embolization.",
  "- No woman needed a hospital stay for a side effect.[^hansrani]",
  "* **Pain fell after embolization in every study that measured it.** {d:cpp-embolization-evidence-6}.",
  "* {d:cpp-embolization-evidence-7}.",
  "* {d:cpp-embolization-evidence-8}.",
  "* **For many women the relief lasted for years.**",
  "- {d:cpp-embolization-evidence-9}.",
  "- {d:cpp-embolization-evidence-10}.",
  "* **Coils or plugs: results were about the same.** {d:cpp-embolization-evidence-11}.",
  "* **Embolization eased pain more than vein pills (micronized purified flavonoid fraction, sold as Daflon).** {d:cpp-embolization-evidence-12}.",
  "* **Embolization vs. surgery to close the vein: pain fell after both.**",
  "- {d:cpp-embolization-evidence-13}.",
  "- {d:cpp-embolization-evidence-14}.",
  "* **A second trial against a fake procedure is under way.**[^embolize]",
]
risks = [
  "Embolization does not cut or remove tissue. The uterus and ovaries stay, and there is no surgical wound to heal.",
  "* **Pain in the pelvis or lower back for the first few days, sometimes with a low fever (post-embolization syndrome).** {d:cpp-embolization-risks-15}.",
  "* **Doctors usually suggest about a week of taking it easy.**[^cpp-eleissawy][^cpp-badak][^cpp-senechal]",
  "* {d:cpp-embolization-risks-16}.",
  "* {d:cpp-embolization-risks-17}.",
  "* {d:cpp-embolization-risks-18}.",
  "* **A small clot can form in a nearby vein.** A center found that though some women had one, most caused no symptoms, and none traveled to the lungs.[^cpp-gav-jsr][^cpp-gav-vte]",
  "* **Hormone levels did not change.** In the study that checked, the ovaries kept working as before.[^kim06]",
]
selection = [
  "* **Pain may come back for some women.** {d:cpp-embolization-selection-19}.",
  "* **A second procedure can help.** {d:cpp-embolization-selection-20}.",
]
fit = "Expert panels in France and Italy name embolization as the first procedure for wide pelvic veins, after scans and after other causes are checked. A U.S. expert panel says embolization and stenting should both be considered.[^lepennec][^baccellieri][^cpp-ajr]"

[[detail]]
option = "stent"
certainty = "Early studies suggest"
headings = { selection = "Who it is for", fit = "Will I need another treatment later?", unknown = "What experts say" }
intro = "A doctor guides a thin tube through a tiny skin nick to the squeezed vein and places a stent, a small mesh tube, to hold it open. The stent stays in for good.[^desai]\nIt is done as an outpatient procedure, and most people go home the same day.[^cpp-rossi][^cpp-aurshina]"
works = "Early studies suggest a stent eases pelvic pain for women whose pain comes from a squeezed vein. Pain fell after a stent in every study we read. How many women were helped varied from study to study. No trial has yet compared a stent with a fake procedure for pelvic pain.[^alenichev][^cpp-larkin][^cpp-trzes]"
evidence = [
  "* {d:cpp-stent-evidence-24}.",
  "* {d:cpp-stent-evidence-25}.",
  "* **At a U.S. vein center, pain fell and stayed lower for a year.** {d:cpp-stent-evidence-26}.",
  "* {d:cpp-stent-evidence-27}.",
  "* **The stronger stent studies are about leg symptoms.** {d:cpp-stent-evidence-28}.",
]
risks = [
  "A stent does not cut or remove tissue. It is a permanent implant, so it needs follow-up over the years.",
  "* **Expect some back pain for the first few days.** Your doctor gives you pain medicine in case you need it. The pain eases with time.",
  "* **Serious side effects are rare.** {d:cpp-stent-risks-29}.",
  "* {d:cpp-stent-risks-30}",
  "* {d:cpp-stent-risks-31}.",
  "* {d:cpp-stent-risks-32}.",
  "* **Most stents stay open.** {d:cpp-stent-risks-33}.",
  "* **You may take a blood thinner for a few months.**[^cpp-ma]",
  "* **Long-term results in young women are still being studied.** {d:cpp-stent-risks-34}.",
]
selection = [
  "A stent is not for everyone. It is for a select group of women whose pain comes from a squeezed vein. This group is often missed.",
  "* **A squeezed vein on a scan is not enough.** {d:cpp-stent-selection-21}.",
  "* **The narrowing can change with your position.** {d:cpp-stent-selection-22}.",
  "* **Doctors confirm the narrowing from inside the vein.** Other causes of pain are checked first. Then the narrowing is measured during the procedure, often with a tiny ultrasound probe inside the vein.[^desai][^cpp-ma]",
  "* **Some women with a squeezed vein do well with embolization alone.** {d:cpp-stent-selection-23}.",
]
fit = [
  "* {d:cpp-stent-fit-35}.",
]
unknown = "U.S. vein experts say a stent may help some women whose pelvic pain comes from a squeezed vein and limits their life. They advise against a stent for people with few or no symptoms, or when the narrowing is mild.[^desai][^cpp-sir]"

[[detail]]
option = "hormones"
certainty = "Good evidence suggests"
intro = "These are hormone pills or shots. Your doctor prescribes them.[^cheong]"
works = "Good evidence suggests hormone medicines ease pain while you take them. However, pain often comes back after you stop.[^cheong][^farquhar]"
evidence = [
  "* **Hormone pills eased pain more than a dummy pill (a placebo).** {d:cpp-hormones-evidence-39}.",
  "* **The benefit faded after the pills were stopped.** {d:cpp-hormones-evidence-40}.",
  "* **A hormone-lowering shot helped more than the pills in one small trial.** {d:cpp-hormones-evidence-41}.",
]
risks = [
  "* **Weight gain and bloating are common with hormone pills.**[^cheong]",
  "* **Hot flashes, headaches and sweating are common with the hormone-lowering shot.** {d:cpp-hormones-risks-42}.",
  "* **Do not take hormone pills while trying for a pregnancy.**[^cheong]",
]

[[detail]]
option = "vein-pills"
certainty = "Early studies suggest"
intro = "These are plant-based pills used for vein problems.[^gloviczki]"
works = "Early studies suggest they may ease pain. {d:cpp-vein-pills-works-43}."
evidence = [
  "* **Pain eased in the studies so far.** {d:cpp-vein-pills-evidence-44}.",
  "* **Vein pills eased pain more than a dummy pill in one trial.** {d:cpp-vein-pills-evidence-45}.",
  "* **Embolization eased pain more than vein pills.** {d:cpp-vein-pills-evidence-46}.",
]
risks = [
  "* **Side effects are few.** {d:cpp-vein-pills-risks-47}.",
]

[[detail]]
option = "hysterectomy"
certainty = "Early studies suggest"
intro = "A surgeon removes the uterus and both ovaries. This is major surgery.[^beard91]"
works = "Early studies suggest it can ease pain. {d:cpp-hysterectomy-works-48}."
evidence = [
  "* **Most women had far less pain a year later.** {d:cpp-hysterectomy-evidence-49}.",
  "* **Hysterectomy vs. embolization: one small study compared them.** {d:cpp-hysterectomy-evidence-50}.",
  "* {d:cpp-hysterectomy-evidence-51}.",
  "* **No trial has tested hysterectomy for this pain.**[^cpp-cochrane-surg]",
]
risks = [
  "No study gives side-effect rates for this surgery when it is done for pelvic vein pain. The numbers here are for hysterectomy done for any noncancer reason.",
  "* **You can no longer get pregnant.**[^beard91]",
  "* **Removing both ovaries causes menopause right away.** Doctors often give hormone replacement.[^beard91]",
  "* {d:cpp-hysterectomy-risks-52}.",
  "* {d:cpp-hysterectomy-risks-53}",
  "* {d:cpp-hysterectomy-risks-54}.",
  "* **Early menopause is linked to a somewhat higher chance of heart disease later in life.** {d:cpp-hysterectomy-risks-55}.",
]

[[detail]]
option = "vein-surgery"
certainty = "Early studies suggest"
intro = "A surgeon ties off and cuts the wide ovarian vein.[^emad]"
works = "Early studies suggest it can ease pain about as much as embolization.[^emad][^cpp-gav-jsr]"
evidence = [
  "* **Surgery vs. embolization: pain fell after both.**",
  "- {d:cpp-vein-surgery-evidence-56}.",
  "- {d:cpp-vein-surgery-evidence-57}.",
]
risks = [
  "* **This is surgery, with a cut in the belly.**[^emad]",
  "* **Side effects in the first month can happen.** In the one study that reported them, most were a small clot in a nearby vein, found on a scan.[^cpp-gav-jsr]",
]

[[section]]
id = "missed"
after = "top"
heading = "Why it is often missed"
text = [
  "Long-term pelvic pain is common in women, and it has many causes. Many women see doctor after doctor, try treatment after treatment, and still have no answer. For some of them, the cause is the veins in the pelvis. Here is why that cause is easy to miss.[^ahangari][^cpp-khilnani]",
  "* **Doctors rarely think of the veins.** A panel of experts says vein problems are rarely considered as a cause of pelvic pain.[^cpp-khilnani]",
  "* **The symptoms look like other conditions.** A dull ache that is worse before a period or after sex can also come from other conditions, such as endometriosis. A woman can have a vein problem and another cause of pain at the same time.[^krambeck][^zlotnik][^beard91]",
  "* **Common tests can miss it.** Doctors often look for the cause of pelvic pain with a small camera through the belly button (laparoscopy). During that test the belly is filled with gas and the head is tilted down. Both flatten the veins, so wide veins can look normal.[^krambeck]",
  "* **Wide veins on a scan can be dismissed as normal.** Wide pelvic veins also show up on scans of women who have no pain. So when a scan shows them, they may not be connected to a woman's pain.[^jurga][^rozenblit]",
  "* **Many women wait years for this diagnosis.** {d:cpp-missed-2}.",
  "* **Some women do not think to mention it.** At one vein center, almost half of the women later treated for a squeezed vein had not brought up their pelvic pain until a doctor asked.[^cpp-rossi]",
  "If you have tried many things and still have no answer, ask your doctor whether the veins in your pelvis could be part of your pain.",
]

[[section]]
id = "both"
after = "vein"
heading = "When both vein problems are present"
text = [
  "Many women have both wide veins and a squeezed vein. Which treatment should come first, and who needs both, is still being researched.",
  "* **In one small trial, treating both gave more lasting relief than a stent alone.** {d:cpp-both-36}.",
  "* **In a larger study, more women improved when embolization was added.** {d:cpp-both-37}.",
  "* **Treating both may bring relief sooner.** {d:cpp-both-38}.",
  "* **Doctors differ on the order.** Some treat the squeezed vein first and add embolization only if pain stays. Others start with embolization, so that a woman may not need a permanent implant.[^cpp-ma][^cpp-xue][^cpp-gav26]",
]

[[section]]
id = "waiting"
after = "medicines"
heading = "Is waiting safe?"
text = [
  "If pain limits your life, talk with your doctor about medicines first. Procedures are an option when medicines do not help. We found no study showing that waiting makes vein-related pelvic pain harder to treat later.[^lepennec][^baccellieri]",
]

[[section]]
id = "pregnancy"
after = "surgery"
heading = "Pregnancy after each treatment"
text = [
  "* **Embolization.** Little is known. Some women have become pregnant afterward, and the reviews found no sign of harm to periods or the ovaries.[^kim06][^daniels]",
  "* **Stenting.** {d:cpp-pregnancy-58}.",
  "* **Hormone medicines.** Hormone pills are not taken while trying for a pregnancy.[^cheong]",
  "* **Hysterectomy.** It ends the chance of pregnancy.[^beard91]",
]

[[section]]
id = "found"
after = "end"
heading = "How is it found?"
text = [
  "Doctors may use an ultrasound, a CT or MRI scan, or a dye test of the veins called a venogram.[^krambeck][^jurga]",
  "Wide or squeezed veins also show up on scans in some women who have no pain. So your doctor looks at your scans and your symptoms together.[^jurga][^rozenblit][^kibbe]",
  "* **Wide veins are common on scans.** {d:cpp-found-59}.",
  "* **A detailed ultrasound can come close to the dye test.** In one study, an ultrasound that scored several vein features together matched the dye test well.[^cpp-mansouri]",
]

[[section]]
id = "menopause"
after = "end"
heading = "Does the pain stop after menopause?"
text = [
  "This is often said, but it has not been well studied.[^bartl]",
]

